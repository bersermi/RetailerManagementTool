<svg xmlns="http://www.w3.org/2000/svg" width="15" height="30" viewBox="0 0 15 30">
  <!--
    A PRICE TAG'S POINTED END — Step 11, row 11.2. The end of a paper tag with its point and its
    string hole; the hole is transparent, so the sheet under the tag shows through it. The rest
    of the tag is a view of the same colour beside it, holding the price as live text in the
    phone's own face (prices in lists stay in the phone's face). Tinted at runtime: `fondo`, the
    counter's grey, so a tag is a piece of the counter's paper on a white sheet.
    Drawn 30 points high; the apps size it to the tag's height and keep its shape
    (`aspectRatio: 0.5`). Drawn by brand/render-mostrador.sh.
  -->
  <path fill-rule="evenodd" d="M15 0H7.2C6.3 0 5.6 0.5 5.2 1.3L0.5 13.5C0.1 14.5 0.1 15.5 0.5 16.5L5.2 28.7C5.6 29.5 6.3 30 7.2 30H15Z M10.4 15A2.4 2.4 0 1 0 5.6 15A2.4 2.4 0 1 0 10.4 15Z"/>
</svg>
