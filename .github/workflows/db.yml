name: db

# ADR-035 §9: "Every schema claim in an ADR must be traceable to a migration that
# CI has applied and tested. A file is not evidence. A green CI run against a real
# Postgres is."
#
# This workflow is that evidence. It applies every migration in supabase/migrations/
# from scratch against a real Postgres, then runs the behavioural checks in
# supabase/tests/ against the result.
#
# The reset alone proves only that the DDL parses. The checks are what prove the
# constraints do their job — and, crucially, they run the isolation assertions
# under `set role authenticated`, because the postgres superuser bypasses RLS and
# would pass them vacuously.
#
# As of plan task 3.1 it also runs pgTAP suites (ADR-035 §2.10) between the two —
# 01 structural (3.1) and 02 behavioural RLS isolation on reads (3.2a). The step
# runs the DIRECTORY in name order, so a third suite costs no edit here.
#
# THE pgTAP SUITES ADD TO supabase/tests/, THEY DO NOT REPLACE IT — this comment
# and supabase/README.md both used to say "replaces", which is a reading of
# ADR-035 §3 step 3 that the ADR does not actually make. §3 step 3 says which
# suites pgTAP is the home of; it says nothing about the 203 behavioural checks
# already standing, and rewriting working, falsified assertions into a second
# framework would risk a great deal to buy tidiness. See docs/PLAN.md task 3.1.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/db.yml"

# A later push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reset:
    name: supabase db reset
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned to the version 0001 was first verified against, so a CLI
          # release cannot turn a green schema red without a commit saying why.
          version: 2.114.0

      - name: Start local Postgres
        run: supabase start

      - name: Apply migrations from scratch
        run: supabase db reset

      # `db reset` exits non-zero if any migration fails to apply, so reaching this
      # step means the schema is real. Print it so a reviewer can read what landed.
      - name: Show applied schema
        run: supabase migration list --local

      # ---------------------------------------------------------------------
      # pgTAP SUITES (ADR-035 §2.10, plan tasks 3.1 and 3.2a)
      #
      # THIS STEP MUST STAY BETWEEN THE RESET AND THE SEED CHECKS, and unlike the
      # step below it the reason is not the seed — it is `public` itself. Every
      # file in supabase/checks/ creates `public._verify` and leaves it standing
      # on purpose so its results survive to be read, and _cleanup.sql truncates
      # rather than drops. Run the structural suite after either of them and it
      # sees three to five scaffolding tables with no RLS and no policies, and
      # reports failures that are not defects. Here it sees exactly what
      # `supabase db reset` produced, which is the thing the suite is about.
      #
      # The suite asserts that position rather than trusting it (test F2), so
      # moving this step down the file turns the job red instead of quiet.
      #
      # pgTAP IS NOT A MIGRATION. It is ~1000 functions and two views, and
      # migrations are append-only — shipping it as 0015 would put a test
      # framework in every production database with no way back. _setup.sql
      # installs it into its own schema `tap` for the length of this step and
      # _teardown.sql drops it, so the database the next step reads is the one
      # the reset built.
      #
      # A pgTAP file under plain psql prints "not ok" to stdout and EXITS 0 — a
      # failing suite that looks identical to a passing one from a workflow's
      # point of view. Each suite therefore ends with
      # `finish(exception_on_failure := true)`, which raises, so ON_ERROR_STOP
      # makes psql exit non-zero. Seven deliberate falsifications were confirmed
      # to fail this step before it was committed (docs/PLAN.md task 3.1), and
      # eight more before 02 was (task 3.2a).
      #
      # 02 WRITES A FIXTURE AND ROLLS IT BACK. `workspace_invite` is the one
      # tenant table the seed leaves empty in both workspaces, and an isolation
      # claim over zero rows is a claim about nothing. The file is one
      # transaction, so the database the steps below read is still the one the
      # reset built — which is also why this step stays above them.
      #
      # FILES BEGINNING WITH `_` ARE HARNESS, NOT SUITES — the same convention
      # supabase/tests/ already uses. The counter is the same concern as the one
      # below: a loop that matched nothing would print nothing and exit 0, which
      # is what a deleted suite directory looks like.
      #
      # ⚠️ AND THE THIRD WAY A FAILING SUITE EXITS 0, found in task 3.3 and the
      # reason each suite's output is now scanned rather than only its exit
      # code. `finish(exception_on_failure := true)` is what every file here
      # relies on to turn a red assertion into a non-zero exit, and pgTAP
      # DISARMS it when the plan does not match the number of tests run:
      #
      #     IF curr_test <> exp_tests THEN
      #         RETURN NEXT diag('Looks like you planned … but ran …');
      #     ELSIF num_faild > 0 THEN
      #         IF raise_ex THEN RAISE EXCEPTION …
      #
      # An ELSIF. A miscounted plan takes the first branch and the exception in
      # the second is never reached — so `not ok` lines print, psql exits 0, and
      # this step goes green. Every suite here computes its plan from what it
      # measured, so every suite can land in that branch. Reproduced in four
      # lines: plan(3), one passing test, one failing test, finish(true) → exit
      # 0; change the plan to 2 and the identical file raises.
      #
      # The grep below is the backstop for ALL FIVE suites, including the four
      # that merged before this was known. 05 carries a per-file guard as well,
      # so it also defends itself when run by hand outside CI.
      - name: pgTAP suites (ADR-035 §2.10)
        run: |
          eval "$(supabase status -o env | grep '^DB_URL=')"
          export DB_URL
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/pgtap/_setup.sql
          ran=0
          out="$(mktemp -d)"
          for f in $(ls supabase/pgtap/*.sql | sort); do
            case "$(basename "$f")" in _*) continue ;; esac
            echo "::group::$f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f" 2>&1 | tee "$out/$(basename "$f").log"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "$f failed (psql exit $rc)" >&2
              exit 1
            fi
            # The disarmed-exception check. A suite whose plan disagrees with
            # what it ran has NOT proved anything, whatever its exit code said.
            if grep -q 'Looks like you planned' "$out/$(basename "$f").log"; then
              echo "$f: plan/actual mismatch — pgTAP suppressed the failure exception" >&2
              grep 'Looks like you planned' "$out/$(basename "$f").log" >&2
              exit 1
            fi
            # Belt and braces: a `not ok` that reached this point reached it
            # because the exception did not fire.
            if grep -qE '^ *not ok [0-9]' "$out/$(basename "$f").log"; then
              echo "$f: failing assertions present despite a zero exit" >&2
              grep -E '^ *not ok [0-9]' "$out/$(basename "$f").log" >&2
              exit 1
            fi
            ran=$((ran + 1))
          done
          if [ "$ran" -eq 0 ]; then
            echo "no suites in supabase/pgtap/ — nothing was asserted" >&2
            exit 1
          fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/pgtap/_teardown.sql
          echo "$ran pgTAP suite(s) ran"

      # ---------------------------------------------------------------------
      # EVERY CHECK IN supabase/checks/, OVER SEED DATA (plan tasks 1.7 and 2.1)
      #
      # This step was the §2.4 invariant alone until 2.1 added the margin view's
      # reconciliation beside it. Both belong here for the same reason and neither
      # could live in supabase/tests/, so the step runs the directory rather than a
      # file, in name order.
      #
      # THIS STEP MUST STAY BETWEEN THE RESET AND THE SUITE LOOP, and the order is
      # the whole reason it is a step of its own rather than a file in
      # supabase/tests/. `_cleanup.sql` runs before every suite and truncates
      # every table but `unit`, so by the time the first suite starts the seed is
      # gone — and an invariant check over an empty database PASSES. That vacuous
      # green is the failure ADR-035 §9 exists to refuse, so the checks below
      # refuse to run at all until they can see a populated ledger.
      #
      # The reset above already ran the seed's own assertions, which raise and
      # exit non-zero. This is not those. Those ask whether each seed file wrote
      # what it meant to; this asks whether the projection agrees with the ledger
      # across all four of them at once, whether the projection can be thrown away
      # and rebuilt from stock_movement alone at seed scale, and whether
      # rebuild_batch_balance(workspace) respects its argument — which is a claim
      # no single-tenant fixture can make.
      #
      # It ends by corrupting the projection on purpose and confirming the check
      # catches it, so a green here is never a green from a check that cannot go
      # red.
      #
      # The file counter is the same concern as reading the suite counts by name:
      # a loop that matched nothing would print nothing and exit 0, which is what
      # a deleted check directory looks like.
      - name: Checks over the seed (ADR-035 §2.4, §2.9)
        run: |
          eval "$(supabase status -o env | grep '^DB_URL=')"
          export DB_URL
          ran=0
          for f in $(ls supabase/checks/*.sql | sort); do
            echo "::group::$f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          if [ "$ran" -eq 0 ]; then
            echo "no files in supabase/checks/ — nothing was checked over the seed" >&2
            exit 1
          fi
          echo "$ran seed check file(s) ran"

      # Every suite in supabase/tests/, in name order, against the database the
      # reset just built. Each one assumes a database holding nothing but its own
      # fixture — they share hardcoded user uuids and assert absolute counts — and
      # none of them can clean up after itself, because the ledger is append-only.
      #
      # SO EACH IS PRECEDED BY supabase/tests/_cleanup.sql, not by another
      # `supabase db reset`. The reset above still runs, once, and it is what
      # proves the migrations apply from scratch (ADR-035 §9); repeating it per
      # file bought nothing beyond an empty database and cost 20.5s a time against
      # the cleanup's 0.56s. The cleanup sweeps pg_tables dynamically and then
      # asserts it emptied what it claims, so an incomplete one fails loudly
      # instead of leaving the next suite counting someone else's rows.
      #
      # FILES BEGINNING WITH `_` ARE HARNESS, NOT SUITES, and are skipped here.
      #
      # TWO KINDS OF SUITE, ADDED FOR 0005. A .sql file is one psql session, which
      # is all a schema check needs and is what every file here was until now. A
      # .sh file drives SEVERAL sessions, and exists because one claim cannot be
      # made from a single connection: "two concurrent allocations cannot oversell
      # one batch" (docs/PLAN.md task 1.3b). A session cannot block on its own
      # lock, so a one-session test of allocate_fefo()'s `for update` would pass
      # just as green with the locking clause deleted — a vacuous pass of exactly
      # the kind supabase/README.md warns about for RLS run as superuser.
      #
      # Both kinds fail the job by exiting non-zero. The `ls | sort` keeps them in
      # one name order instead of running all .sql before all .sh.
      - name: Behavioural checks
        run: |
          eval "$(supabase status -o env | grep '^DB_URL=')"
          export DB_URL
          for f in $(ls supabase/tests/* | sort); do
            case "$(basename "$f")" in _*) continue ;; esac
            echo "::group::$f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/tests/_cleanup.sql
            case "$f" in
              *.sql) psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f" ;;
              *.sh)  bash "$f" ;;
              *)     echo "unrecognised test file: $f" >&2; exit 1 ;;
            esac
            echo "::endgroup::"
          done

      - name: Stop
        if: always()
        run: supabase stop --no-backup
