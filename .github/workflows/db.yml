name: db

# ADR-035 §9: "Every schema claim in an ADR must be traceable to a migration that
# CI has applied and tested. A file is not evidence. A green CI run against a real
# Postgres is."
#
# This workflow is that evidence. It applies every migration in supabase/migrations/
# from scratch against a real Postgres, then runs the behavioural checks in
# supabase/tests/ against the result.
#
# The reset alone proves only that the DDL parses. The checks are what prove the
# constraints do their job — and, crucially, they run the isolation assertions
# under `set role authenticated`, because the postgres superuser bypasses RLS and
# would pass them vacuously.
#
# As of plan task 3.1 it also runs pgTAP suites (ADR-035 §2.10) between the two —
# 01 structural (3.1) and 02 behavioural RLS isolation on reads (3.2a). The step
# runs the DIRECTORY in name order, so a third suite costs no edit here.
#
# ⚠️ AS OF PLAN TASK 3.6b ONE SUITE READS A FILE FROM OUTSIDE supabase/. 07 builds
# its case tables from packages/money/cases.json — the same bytes Vitest reads —
# which is §2.10's "one data file, read by both". psql reads it CLIENT-SIDE
# (pg_read_file runs in the server, and the server is a container that cannot see
# this repo), relative to the working directory. That is why the loop below runs
# from the repo root, and why that path is in this workflow's `paths:` filter.
#
# THE pgTAP SUITES ADD TO supabase/tests/, THEY DO NOT REPLACE IT — this comment
# and supabase/README.md both used to say "replaces", which is a reading of
# ADR-035 §3 step 3 that the ADR does not actually make. §3 step 3 says which
# suites pgTAP is the home of; it says nothing about the 203 behavioural checks
# already standing, and rewriting working, falsified assertions into a second
# framework would risk a great deal to buy tidiness. See docs/PLAN.md task 3.1.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/db.yml"
      # ⚠️ THE CASE TABLE IS AN INPUT TO THIS WORKFLOW as of plan task 3.6b.
      # 07_money_and_units.sql reads packages/money/cases.json rather than its
      # own copy (ADR-035 §2.10, "one data file"), so a change to that file must
      # run the SQL side that reads it. Without this line the pgTAP half of the
      # paired-arithmetic claim would silently not run on the one commit most
      # likely to break it.
      - "packages/money/cases.json"
      # ⚠️ AND THE WORKSPACE MANIFESTS, as of plan task 3.7a. This workflow now
      # runs `npm ci` and a Vitest suite (supabase/vitest/), so the lockfile and
      # the root manifest decide what it installs. Without these two lines a
      # dependency bump could turn the concurrency suite red on main having
      # passed no PR — the same argument that put cases.json above.
      - "package.json"
      - "package-lock.json"
      # ⚠️⚠️ AND THE APP'S DATA LAYER, as of plan task 5b-i. This is the first
      # time a workflow over `supabase/**` has watched a file under `app/`, and
      # the reason is that `app/src/api/workspace.ts` is now a CLAIM ABOUT THE
      # APPLIED SCHEMA — the RPC's name, its three argument names, the columns
      # read off `workspace`. PostgREST resolves an RPC by its parameter names,
      # so a rename on either side of that line is a 404 (`PGRST202`) that the
      # typecheck, the Vitest suite and the bundler all pass straight over. Two
      # files, one claim — so an edit to EITHER has to re-run the check that
      # watches it, which is the same argument that put `packages/money/cases.json`
      # above and `docs/CONVENTIONS.md` in app.yml.
      - "app/src/api/**"
      - "docs/checks/5b-i-api-contract.sh"
      - "docs/checks/5b-i-api-contract-falsify.sh"
      # ⚠️⚠️ AND THE ROSTER'S, as of plan task 5b-ii-a. `app/src/api/members.ts`
      # is a second claim about the applied schema — two column lists — and it
      # carries something `workspace.ts` does not: a claim about a POLICY. The
      # owner ruled the roster manager-and-above on the measured asymmetry
      # between `workspace_invite_select` (manager) and `workspace_member_select`
      # (any member). A migration that loosened the first would make the client's
      # fence wrong, and NOTHING ELSE HERE WOULD GO RED — a policy that allows
      # more breaks no test. That is why `supabase/migrations/**` re-running this
      # is the point rather than a side effect.
      - "docs/checks/5b-ii-a-roster-contract.sh"
      - "docs/checks/5b-ii-a-roster-contract-falsify.sh"
      # ⚠️⚠️ AND THE NAME AT SIGN-UP, as of plan task 5b.7. This one watches
      # `app/src/auth/`, which no workflow over `supabase/**` has ever looked at
      # — and the reason is that `signUp`'s `options.data` is a claim about
      # GoTrue rather than about PostgREST: that the name a person types is
      # written to `raw_user_meta_data` and STAYS there. ⚠️ GoTrue does not
      # reject an unknown option and does not reject a missing one, so the
      # failure is a silent absence: the account is created, the shopkeeper
      # reaches her shop, and `5b.8`'s backfill later reads an empty column for
      # everyone who joined in between. They cannot be asked again.
      - "app/src/auth/**"
      - "docs/checks/5b.7-signup-name-contract.sh"
      - "docs/checks/5b.7-signup-name-contract-falsify.sh"
      # ⚠️⚠️ AND THE INVITE PATH, as of plan task 5b-ii-b-1. It watches
      # `app/src/api/invites.ts` because that module holds the four `p_` names
      # `create_invite` answers to, and PostgREST matches an RPC BY ITS
      # PARAMETER NAMES — so a rename there is a 404 the typecheck, the suite
      # and the bundler all pass over, reaching a shopkeeper as a button that
      # does nothing. ⚠️ It also asserts the one thing no suite can reach: that
      # the minted token is NOT in `workspace_invite`. Only the hash is stored
      # (`0002:364`), and if that stopped being true every Vitest assertion
      # would stay green with the secret sitting in a readable column.
      - "docs/checks/5b-ii-b-1-invite-contract.sh"
      - "docs/checks/5b-ii-b-1-invite-contract-falsify.sh"
      # ⚠️⚠️ AND THE OTHER HALF OF THE LOOP, as of plan task 5b-ii-b-2. It
      # watches `app/src/api/redeem.ts` for the reason above — a `p_` name is a
      # 404 nothing in `app/` can see — and for one this repository has not had
      # before: THE APP DECIDES WHICH RPC TO CALL BY MEASURING A LENGTH. An
      # invite token (16) and a shop's join code (8) are the same Crockford
      # alphabet and the same normaliser and carry no label, so length is the
      # whole decision (`P2`). It is sound only while `generate_invite_token`
      # mints sixteen and `workspace_code_shape` admits eight — both of which
      # live under `supabase/migrations/**`, which is why a migration re-running
      # this check is the point rather than a side effect.
      - "docs/checks/5b-ii-b-2-redeem-contract.sh"
      - "docs/checks/5b-ii-b-2-redeem-contract-falsify.sh"
      # ⚠️⚠️ AND THE BOX A PERSON FIXES HER OWN NAME IN, as of plan task
      # `5b.8-iii-b`. It watches `app/src/api/displayName.ts` for the `p_`-name
      # 404 above, and for TWO reasons the other four contract checks do not
      # have. ⚠️ FIRST: `0035` RAISES ONE SQLSTATE FOR TWO DIFFERENT REFUSALS —
      # no session, and not a member of this shop — so the app tells them apart
      # by a MARKER IN THE SERVER'S PROSE, and a migration rewording that
      # sentence would silently tell a person who has been removed from the shop
      # that her session ended. ⚠️⚠️ SECOND: it is the only check in this
      # repository that measures A CASHIER WRITING TO `workspace_member`.
      # `workspace_member_update` (`0001:532`) is owner-only, so that write
      # exists solely because `0035` is `security definer` — and a later
      # migration touching either would leave every suite here green.
      - "docs/checks/5b.8-iii-b-name-contract.sh"
      - "docs/checks/5b.8-iii-b-name-contract-falsify.sh"
      # ⚠️⚠️ AND THE PULL PATH, as of plan task `5b-iii-b`. It watches
      # `app/src/api/requests.ts` for the `p_`-name 404 above, and for two claims
      # no suite in this repository can reach. ⚠️ FIRST — `S3`: that a person who
      # has just asked to join CANNOT read her own request any other way.
      # `workspace_invite_select` (`0002:563`) is manager-and-above and she has
      # no role at all, which is the entire reason `my_access_requests` is
      # `security definer`. A migration widening that policy would make the check
      # red while every Vitest assertion stayed green — and the cheap reading of
      # that red is "the function is redundant now", which is one predicate away
      # from the shop enumeration `D6` refuses. ⚠️⚠️ SECOND: `0029` RAISED
      # `42501` FOR AN UNKNOWN CODE, WHICH IS ALSO WHAT AN ABSENT SESSION LOOKS
      # LIKE — `@/api/errors` maps it app-wide to "your session ended" — so the
      # app had to read it as the CODE on this screen only, and the check DROVE
      # BOTH and asserted they came back indistinguishable. ✅ `0038` (task
      # `5b.9`) minted `TD006` and ended that on 2026-09-22; the check now drives
      # both and asserts they come back DIFFERENT, which is what says a later
      # migration cannot re-merge them silently.
      - "docs/checks/5b-iii-b-request-contract.sh"
      - "docs/checks/5b-iii-b-request-contract-falsify.sh"
      # ⚠️⚠️ AND THE APPROVER'S HALF OF IT, as of plan task `5b-iii-d-1`. It
      # watches `app/src/api/approvals.ts` for the `p_`-name 404 above, plus the
      # COLUMN LIST — which no other instrument in this repository looks at. A
      # renamed column is not an error at the client: the field is `unknown`, the
      # typecheck is happy, the suite's fixtures are hand-written objects, and
      # what reaches a person is a BLANK where a stranger's address should be on
      # the one screen whose job is to identify her. ⚠️ AND THE FENCE, WHICH IS
      # `0037`'s decision 2 and cannot be seen from a row count: a non-owner is
      # answered with an EMPTY LIST rather than refused — deliberately, so this
      # path does not acquire a third meaning for `42501` — so the check reads ONE
      # workspace holding the SAME two pending requests as an owner (two rows) and
      # as a manager, a cashier, a stranger and the requester herself (zero). The
      # PAIR is the assertion; either half alone is vacuous.
      # ⚠️ `credentials.ts` IS IN THE FILTER because the check reads
      # `FULL_NAME_KEY` out of it: the name this queue renders reaches the
      # database through that constant at sign-up, and a drift there means every
      # account created from then on is nameless, silently.
      - "docs/checks/5b-iii-d-1-approvals-contract.sh"
      - "docs/checks/5b-iii-d-1-approvals-contract-falsify.sh"
      # ⚠️⚠️ AND THE ACT, as of plan task `5b-iii-d-2` — the only WRITE on this
      # screen, and the one whose central rule §2.11 removed every instrument
      # for. `D8`: an approved staff member with no `member_location` row is
      # inside the shop and can do NOTHING in it, because `location_select`
      # (`0001:506`) is `id in (select my_locations())` and RLS refuses her
      # every write with no message. The client refuses to send an empty array
      # and `0029:407` refuses to accept one — two copies of one rule, and this
      # check is what says they still agree. ⚠️ IT ALSO SIGNS IN AS HER: the
      # approved staff member must read exactly the store she was given and not
      # the other, which is the only assertion anywhere here that measures `D8`
      # on the person it protects rather than on a refusal.
      # ⚠️ `invites.ts` IS IN THE FILTER because `D8`'s predicate lives there —
      # `checkLocations`, asked by BOTH `checkInvite` and `checkApproval`, since
      # `create_invite` and `approve_request` are the two writers of
      # `member_location`. An edit to that one function moves the fence on two
      # screens at once.
      - "docs/checks/5b-iii-d-2-approve-contract.sh"
      - "docs/checks/5b-iii-d-2-approve-contract-falsify.sh"
      # ⚠️⚠️ THE SESSION READING (plan `5c.5`), and its filter is WIDER than
      # its own files on purpose. It is the only thing here that would notice
      # a GoTrue or `auth-js` bump changing whether a dropped connection signs
      # a shopkeeper out — so the lockfile and `config.toml` are inputs to it
      # in a way they are not to a contract check, and `supabase.ts` is where
      # the client options it reasons about are set.
      - "docs/checks/5c-5-refresh-under-loss.sh"
      - "docs/checks/5c-5-refresh-under-loss-falsify.sh"
      - "docs/checks/lib/5c-5-refresh-under-loss.mjs"
      - "app/src/lib/supabase.ts"
      - "package-lock.json"
      - "app/src/api/approvals.ts"
      - "app/src/api/invites.ts"
      - "app/src/auth/credentials.ts"
      # ⚠️⚠️ THE FLUSH (plan task `5c-ii-a`). `app/src/api/**` above already
      # matches `flush.ts`, but the check and its harness are named here for the
      # rule that has cost this repository a day once already: WHEN AN ASSERTION
      # GAINS A NEW INPUT, EVERYTHING THAT RUNS IT GAINS THE SAME INPUT. An edit
      # to the check alone — loosening an assertion, say — must re-run it.
      - "docs/checks/5c-ii-a-flush-contract.sh"
      - "docs/checks/5c-ii-a-flush-contract-falsify.sh"
      # ⚠️⚠️ THE DEAD LETTER (plan task `5c-iii`), AND IT IS THE ONLY HALF OF
      # STEP 5 THAT CHANGES THE LEDGER. Same rule as the two lines above: the
      # check and its harness are named here because an edit to the check alone
      # — loosening an assertion — must re-run it.
      - "docs/checks/5c-iii-dead-letter-contract.sh"
      - "docs/checks/5c-iii-dead-letter-contract-falsify.sh"
      # ⚠️⚠️ AND THE CATALOG, as of plan task `5d-i` — the first claim in this
      # app about what a shop SELLS rather than about who works in it, and the
      # first that is not an RPC at all: four column lists, an EMBED across a
      # composite foreign key, and a price window expressed as PostgREST filters.
      # ⚠️ Two of its assertions exist nowhere else. The `::text` casts are the
      # only thing standing between the money path and a DOUBLE — drop them and
      # `parseDecimal` refuses every price, with the typecheck, the suite and the
      # bundler all green. And the price WINDOW has no second home by design:
      # *"which price is today's"* lives in the query, so a widened window puts
      # last year's price on a shelf and nothing in TypeScript could disagree.
      # ⚠️⚠️ IT ALSO HOLDS A DECISION TAKEN ON THE OWNER'S BEHALF: Productos is
      # shown to every member, because `product_variant_select` and
      # `price_list_select` admit every member while the INSERT/UPDATE policies
      # are manager-fenced. A migration that narrowed either would empty that
      # screen for the person at the counter, and a policy that allows LESS
      # breaks no test — which is why `supabase/migrations/**` re-running this is
      # the point rather than a side effect.
      - "docs/checks/5d-i-catalog-contract.sh"
      - "docs/checks/5d-i-catalog-contract-falsify.sh"
      # ⚠️⚠️ AND THE TAKINGS, as of plan task `5d-iv-a` — the read §2.8's Home row
      # has asked for since the ADR was written and no line in this app had ever
      # performed. Same rule as every line above: the check and its harness are
      # named here because an edit to the check alone — loosening an assertion —
      # must re-run it.
      # ⚠️ Three of its assertions exist nowhere else. The `::text` casts are all
      # that stand between the peso figure and a DOUBLE, and a dropped one does
      # not show a wrong number — it shows NO number, because `parseDecimal`
      # refuses a number argument and the app withholds the figure. The day
      # WINDOW has no second home by design: *"which rows are today's"* lives in
      # the query, and moving it to `recorded_at` sweeps last night's late trade
      # into this morning's takings on a shop that is offline half the day. And
      # what a VOID actually writes — a second row, negated, rather than a delete
      # — is the premise of the whole count rule, asked rather than read off
      # `0021`.
      # ⚠️⚠️ IT ALSO HOLDS A RULING: a CASHIER sees the day's takings, decided
      # 2026-09-14 (*"a cashier keeps seeing quantity and revenue"*). `sale_select`
      # is member-level with no `has_role` in it; a migration that narrowed it
      # would blank the top of Inicio for the person at the counter, and a policy
      # that allows LESS breaks no test — which is why `supabase/migrations/**`
      # re-running this is the point rather than a side effect.
      - "docs/checks/5d-iv-a-takings-contract.sh"
      - "docs/checks/5d-iv-a-takings-contract-falsify.sh"
      # ⚠️⚠️ AND THE CATALOG WRITE, as of plan task `5e-i` — the first line in this
      # app that CREATES anything a shop sells, and the first whose central claim
      # is a POLICY rather than a column. Same rule as every line above: the check
      # and its harness are named here because an edit to the check alone —
      # loosening an assertion — must re-run it.
      # ⚠️⚠️ THIS IS THE ONE THAT HOLDS A FENCE. `product_family_insert`,
      # `product_variant_insert` and `price_list_insert` are all
      # `has_role(…, 'manager')` in `0002`, and NOTHING ELSE IN THIS REPOSITORY
      # CAN SEE THAT: no typecheck, suite or bundler has ever read a policy,
      # `CREATE POLICY` is not in the knowledge graph, and RLS is bypassed by the
      # `postgres` superuser, so a check run as superuser passes vacuously. This
      # one signs a real cashier in over real HTTP and asserts she is refused on
      # all three tables. ⚠️ A POLICY THAT ALLOWS MORE BREAKS NO TEST — and
      # `5e-ii` DRAWS that fence rather than discovering it, so the day one of
      # them is widened the app is hiding a control from somebody entitled to use
      # it, silently. Which is why `supabase/migrations/**` re-running this is the
      # point rather than a side effect.
      # ⚠️ Three more of its assertions exist nowhere else. The ORDER of the three
      # writes is a correctness rule resting on two composite foreign keys, and
      # the only way to say so is to post a price before its variant. The
      # uniqueness is SHOP-WIDE, which is why the app's sentence deliberately does
      # not blame the family. And the price written TODAY must be on TODAY's
      # catalog read, byte for byte, through `5d-i`'s own window — the only place
      # `pricePerBase` and `priceCentavos` meet over a real `numeric(14,6)`.
      - "docs/checks/5e-i-catalog-write-contract.sh"
      - "docs/checks/5e-i-catalog-write-contract-falsify.sh"

      # ⚠️⚠️ AND THE EDIT SIDE, WHICH IS A DIFFERENT FENCE AND NOT THE SAME ONE
      # AGAIN. `price_list_insert` is `with check`, so a cashier posting a price is
      # a `42501` the file above already asserts. Every UPDATE policy on these
      # tables is `using` as well, and a row a `using` clause excludes is a row
      # PostgREST CANNOT SEE — the PATCH matches nothing and comes back 200 with an
      # empty array. Measured 2026-09-23. So `catalogEdit.ts` sends `.single()` on
      # every patch to turn that into a `PGRST116`, and this check is the only
      # instrument that can say either shape is still what the database does.
      # ⚠️ Its other two: the ORDER — close before you open, because
      # `price_list_no_overlap` refuses two rows over one day — and the SAME-DAY
      # branch, which exists because `price_list_range_ordered` refuses a
      # zero-length range and nothing in TypeScript can discover that.
      - "docs/checks/5e-iii-a-catalog-edit-contract.sh"
      - "docs/checks/5e-iii-a-catalog-edit-contract-falsify.sh"
      # ⚠️⚠️ AND THE BUY SIDE, as of plan task `5g-i` — the FIRST thing in this
      # repository ever to send `record_purchase` anything. `0018` has been
      # applied since 2026-09-04 and `5f-i`'s row said out loud that nothing had
      # asked Postgres whether it accepts the payload this app builds.
      # ⚠️⚠️ THREE OF ITS ASSERTIONS EXIST NOWHERE ELSE AND ONE OF THEM IS WHY
      # `5g` SPLIT AT ALL. Comprar's design rests on a measured asymmetry:
      # `provider_select` admits any member, `provider_price_memory` is
      # manager-and-above through `security_invoker`, and `record_purchase`
      # fences NEITHER — so a cashier reads the picker, reads ZERO rows of the
      # memory (200 and an empty array, never a 403), records a delivery that
      # SUCCEEDS, and reads zero purchases back. **Every symptom of the broken
      # case is a designed state of the working one** — §2.8's *new pairing* IS
      # an empty memory — so no screen and no person looking at a screen can
      # tell them apart, and a migration that moved any of the three would
      # change what a shop silently sees with nothing else going red.
      # ⚠️ The second: the invoice net reaches the ledger UNCONVERTED. §2.5 rule
      # 2 scopes `prices_include_tax` to the SALE in its own parenthesis, and
      # `@/cart/cart` disagreed with it until 2026-09-24.
      # ⚠️ The third: what the seeded generic provider is CALLED, read off the
      # wire. F6 says `Genérico`, `onboard_workspace` has seeded `Compra
      # directa` since `0002`, and the owner owes the word — so this goes red the
      # day either one moves rather than letting the plan carry both for ever.
      - "docs/checks/5g-i-purchase-contract.sh"
      - "docs/checks/5g-i-purchase-contract-falsify.sh"

      # ⚠️⚠️ `5g-iii` — THE PRICE SERIES BEHIND `Costos`, AND IT IS HERE FOR ONE
      # ASSERTION NO OTHER INSTRUMENT CAN MAKE: that PostgREST really sorts the
      # PARENT by an embedded column. `app/src/api/costs.ts` spells the order as
      # `purchase(occurred_at)`; the tempting alternative,
      # `.order('occurred_at', { referencedTable: 'purchase' })`, sets the query
      # key `purchase.order` and sorts the embedded row INSIDE each parent —
      # which on a to-one embed is nothing at all. **200, typechecked, and the
      # chart's points left in planner order**, redrawn differently on a re-plan
      # with nothing going red. A node suite can only read the string.
      # ⚠️ It also proves the embed resolves over a COMPOSITE foreign key
      # (`purchase_line_header_fk` is three columns), that the `::text` cast is
      # still there — measured off the WIRE, because without it the price is a
      # double and `parseDecimal` refuses one — and that BOTH halves of a void
      # come back, so dropping them is provably the client's job.
      # ⚠️ And that §2.9's own `product_purchases_daily` still has no
      # `provider_id`, which is the whole reason this read goes to
      # `purchase_line`: the day somebody widens that view, this goes red and
      # says the decision can be revisited.
      - "docs/checks/5g-iii-costs-contract.sh"
      - "docs/checks/5g-iii-costs-contract-falsify.sh"

      # ⚠️⚠️ AND THE MAGNITUDE GUARD'S READ, as of plan task `5f.5`. ADR-035
      # §2.8's third error-prevention guard compares a keyed quantity or cost
      # against the trailing median for that product, and its read is the first
      # in this app to ask `purchase_line` for a QUANTITY — so `qty_base::text`
      # is a cast nothing here had yet proved. ⚠️ **Its failure is silent**:
      # without the cast the figure arrives as a double, `parseDecimal` refuses a
      # number argument, every sample is dropped and the warning simply never
      # appears. No exception, no red test, and a shopkeeper told nothing is
      # unusual. ⚠️ It also proves `order` and `limit` COMPOSE over the composite
      # foreign key — *trailing* is not a column, it is a slice of an order — and
      # that an Empleada reads the whole history, which is what `0040` made true
      # and what §2.8's own paragraph about a cashier depends on.
      - "docs/checks/5f.5-magnitude-contract.sh"
      - "docs/checks/5f.5-magnitude-contract-falsify.sh"

      # ⚠️⚠️ AND THE LIST EVERY CORRECTION IS REACHED FROM, as of plan task
      # `5h-ii-a`. `app/src/api/documents.ts` is the first read in this app to
      # start at a DOCUMENT and ask for its LINES — a **to-many** embed over a
      # **composite** foreign key, where every other embed here is to-one and read
      # from the line. Four of its claims are 200-and-wrong rather than red, and
      # nothing but a real PostgREST can see any of them: that the embed resolves
      # at all; that `::text` survives INSIDE it (without the cast `3.000` arrives
      # as the number `3` and the screen still looks right); that a parent `limit`
      # counts DOCUMENTS rather than joined rows, so `DOCUMENTS_LIMIT` never cuts a
      # delivery in half; and that PostgREST will sort the lines by a NESTED
      # embedded column — which it must, because **nothing in this schema records
      # the order a shopkeeper keyed them in.** ⚠️ It also asserts an Empleada
      # reads both kinds, headers AND lines: she is the person who keys the
      # deliveries, and before `0040` her read was 200 and an empty array.
      - "docs/checks/5h-ii-a-documents-contract.sh"
      - "docs/checks/5h-ii-a-documents-contract-falsify.sh"
      # ⚠️⚠️ `5h-ii-b`. `app/src/api/corrections.ts` is the first module in this app
      # that CANCELS anything, and four of its claims are invisible to every other
      # instrument here: that `void_transaction`'s three `p_` argument names match
      # `0021` (a mismatch is a 404, not a bad call); that `TD003` arrives as the
      # code on an HTTP **400** so `@/api/errors` can turn it into a sentence; that
      # a replay's body is SHORTER than a first void's; and that a voided delivery
      # can be re-recorded without colliding on `payload_hash`, which is the whole
      # of `Corregir`.
      - "docs/checks/5h-ii-b-corrections-contract.sh"
      - "docs/checks/5h-ii-b-corrections-contract-falsify.sh"
      # ⚠️⚠️ AND DESPERDICIO'S, as of plan task `6a-i`. `app/src/api/waste.ts` is
      # already covered by `app/src/api/**` above, but the two check files are not
      # — and this one watches `app/src/cart/cart.ts` too, which NO path filter here
      # has ever named. That module is where `PRICE_KEY`, `MONEY_KIND` and
      # `UNPRICED_WASTE` live: the price key a write-off is anchored on, and the
      # zero an unpriced loss is sent at. **Both are claims about `0019` rather than
      # about a basket**, so a change to either must run against a real database.
      - "app/src/cart/cart.ts"
      - "docs/checks/6a-i-waste-contract.sh"
      - "docs/checks/6a-i-waste-contract-falsify.sh"
      # ⚠️⚠️ AND READING A WRITE-OFF BACK, as of plan task `6a-ii-a` — `0041`, the
      # first `security definer` view in this schema. It is the ONLY instrument
      # anywhere that can see whether that view works: the pgTAP suite reads it in
      # SQL, where a correct-but-unembeddable view passes; the Vitest suite reads
      # the app's constants against fixtures it wrote itself; and
      # `supabase/pgtap/01_rls_coverage.sql` joins `relkind = 'r'`, so **a view is
      # invisible to the RLS guard by construction.**
      - "docs/checks/6a-ii-a-waste-list-contract.sh"
      - "docs/checks/6a-ii-a-waste-list-contract-falsify.sh"
      # ⚠️⚠️ AND PUTTING ONE RIGHT, as of plan task `6a-ii-b`. It watches
      # `app/src/api/corrections.ts` for the `p_`-name 404 every contract check
      # here watches for — and for something none of the others has: **a claim that
      # one string can be sent back.** `@/api/documents` renders a cause through
      # `reasonLabel`, a one-way door, and `Corregir` re-records from the WIRE value
      # beside it. The two differ by a capital letter, both are strings, and no
      # typecheck or Vitest fixture can tell them apart — only a real
      # `record_waste` refusing the word (`22P02`) can.
      - "docs/checks/6a-ii-b-waste-correction-contract.sh"
      - "docs/checks/6a-ii-b-waste-correction-contract-falsify.sh"
      # ⚠️⚠️ AND THE PROVIDER DIRECTORY, as of plan task `6b` — the first thing in
      # this app that WRITES a `provider` row, twenty-five days after it started
      # reading them. It is the only instrument anywhere that can see any of three
      # things: that a cashier is refused an INSERT with `42501` on a 403 **and an
      # UPDATE with a 200 and an empty array**, because `provider_update`'s `using`
      # clause makes the row invisible rather than refusing the write; that
      # `normalize_name` folds case and whitespace and **NOT accents**, which is
      # what makes `checkProvider` deliberately stricter than its own schema; and
      # that **the generic row can still be DEACTIVATED**, which nothing in Postgres
      # prevents and `canRetire` is therefore the only fence there is.
      - "docs/checks/6b-provider-directory-contract.sh"
      - "docs/checks/6b-provider-directory-contract-falsify.sh"
      # ⚠️⚠️ AND THE PREBUILT-CATALOG MARKER, as of plan task `6c` — `0042`, and the
      # only instrument anywhere that can see any of these: that a refused retire is an
      # HTTP **400 with code `23001`** rather than a 403 or a 409, which is the string
      # `catalogEditErrorMessage` keys on; that a prebuilt product is **still renamed
      # and repriced** (the fence is a trigger on a TRANSITION and not a policy
      # predicate on a ROW, and the policy version would have merged green while
      # breaking the catalog it protects); that `is_prebuilt` arrives as a **JSON
      # boolean** and not as the truthy string `'false'`; and that a cashier's retire is
      # **silent** rather than the trigger's error, because the policy excludes her row
      # before the trigger can ever fire.
      - "docs/checks/6c-catalog-origin-contract.sh"
      - "docs/checks/6c-catalog-origin-contract-falsify.sh"
      - "docs/checks/9d-starter-catalog-contract.sh"
      - "docs/checks/9d-starter-catalog-contract-falsify.sh"
      - "docs/checks/7a-sales-contract.sh"
      - "docs/checks/7a-sales-contract-falsify.sh"
      - "docs/checks/7d-month-export-contract.sh"
      - "docs/checks/7d-month-export-contract-falsify.sh"
      - "docs/checks/7b-prices-contract.sh"
      - "docs/checks/7b-prices-contract-falsify.sh"

# A later push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # ⚠️⚠️ ITS OWN JOB, AND THAT IS A MEASUREMENT RATHER THAN TIDINESS. When this
  # was written the `reset` job ran 12m27s against a `timeout-minutes: 15` cap,
  # and this reading takes about two minutes on its own because the cooldown it
  # measures is sixty seconds long and cannot be hurried from outside the
  # library. Bolting it on would have put that job at ~14.5 minutes — and this
  # repository has already had a harness CANCELLED at the cap, which is neither
  # a pass nor a failure and is the worst of the three to merge on. Jobs run in
  # parallel, so this costs wall-clock nothing.
  #
  # ⚠️ THE NUMBER IS HISTORICAL SINCE 2026-09-24 AND THE ARGUMENT IS NOT: `5R-g`
  # split `reset` for exactly this reason and it now runs ~9m. **This paragraph
  # made the case twice before anyone acted on it** — here and in `catalog-write`
  # below — so it is kept as written rather than restated in the past tense.
  #
  # WHAT IT GUARDS (plan task `5c.5`): that a refresh whose REPLY is lost does
  # not sign a shopkeeper out. That is a claim about GoTrue and `auth-js`, not
  # about our code, so NOTHING ELSE HERE WOULD NOTICE a version bump changing
  # it — and the first symptom would be a pilot shopkeeper signed out mid-sale
  # with no explanation. The pilot store is offline a lot; this is not
  # hypothetical there.
  # ===========================================================================
  auth-session:
    name: session survives a lost refresh reply
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      # ⚠️ `auth` AND `db` ARE THE ONLY SERVICES THIS NEEDS, and the instrument
      # talks to GoTrue through the API gateway. Bringing up the rest would be
      # a minute of start-up for containers nothing here touches.
      - name: Start Postgres and GoTrue
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # `@supabase/supabase-js` is a root-workspace dependency; the instrument
      # resolves it from the repo root because ESM ignores NODE_PATH.
      - name: Install workspace dependencies
        run: npm ci

      - name: Reading — does a session survive a refresh whose reply is lost (plan 5c.5)
        run: bash docs/checks/5c-5-refresh-under-loss.sh

      # ⚠️ AND CAN THE READING STILL FAIL? Most fixtures feed the check a
      # CRAFTED reading rather than re-running the two-minute instrument —
      # what is being falsified there is the JUDGE. One fixture mutates the
      # real instrument, because the one thing a crafted reading cannot test
      # is whether the instrument itself is honest about what it dropped.
      - name: Reading — can it still fail (its own fixtures)
        run: bash docs/checks/5c-5-refresh-under-loss-falsify.sh

      - name: Stop
        if: always()
        run: supabase stop --no-backup

  # ===========================================================================
  # ⚠️⚠️ ITS OWN JOB, AND IT IS A MEASUREMENT RATHER THAN TIDINESS — the same
  # argument `auth-session` above makes, and this time the measurement is a
  # CANCELLED RUN rather than a prediction. ⚠️ The `reset` job below was then
  # running 12-13 minutes against its `timeout-minutes: 15` cap and had been
  # CANCELLED THREE TIMES ON `main` on 2026-09-22 before this task touched
  # anything. Appending this check and its fifteen-fixture harness to it made
  # that deterministic: run 35811840869 was cancelled mid-way through a step
  # that predates `5e-i`, so these two never ran at all.
  #
  # ⚠️ A CANCELLED JOB IS NEITHER A PASS NOR A FAILURE, AND IT IS THE WORST OF
  # THE THREE TO MERGE ON — the sentence `auth-session` already carries, now
  # with a second run behind it. Jobs run in parallel, so this costs wall-clock
  # nothing and takes ~2 minutes off the capped job's critical path.
  #
  # ⚠️⚠️ WHAT IT GUARDS (plan task `5e-i`): THE MANAGER FENCE. `product_family_insert`,
  # `product_variant_insert` and `price_list_insert` are all
  # `has_role(…, 'manager')` in `0002`, and NOTHING ELSE IN THIS REPOSITORY CAN
  # SEE THAT — no typecheck, suite or bundler has ever read a policy, `CREATE
  # POLICY` is not in the knowledge graph, and RLS is bypassed by the `postgres`
  # superuser, so a check run as superuser passes vacuously. This signs a real
  # cashier in over real HTTP and asserts she is refused on all three tables.
  # ⚠️ A POLICY THAT ALLOWS MORE BREAKS NO OTHER TEST — and `5e-ii` DRAWS that
  # fence rather than discovering it, so the day one is widened the app is
  # hiding a control from somebody entitled to use it, silently.
  #
  # ⚠️ Three more of its assertions exist nowhere else. The ORDER of the three
  # writes is a correctness rule resting on two composite foreign keys, and the
  # only way to say so is to post a price before its variant. The uniqueness is
  # SHOP-WIDE, which is why the app's sentence deliberately does not blame the
  # family. And the price written TODAY must be on TODAY's catalog read, byte
  # for byte, through `5d-i`'s own window — the only place `pricePerBase` and
  # `priceCentavos` meet over a real `numeric(14,6)`.
  # ===========================================================================
  # ⚠️⚠️ ITS OWN JOB, AND IT IS THE SAME MEASUREMENT `catalog-write` MADE —
  # ADDED BY `5h-ii-a` ON 2026-09-26, WHICH IS THE THIRD TIME THIS WORKFLOW HAS
  # SPLIT RATHER THAN APPEND. These two steps were written into `catalog-write`
  # first and taken back out: **that job was already running 12-13 minutes against
  # its `timeout-minutes: 15` cap**, by its own header, and it had been cancelled
  # three times on `main` before `5R-g` split it. Appending to a job that close to
  # its cap is how a cancellation becomes deterministic — and ⚠️ **a cancelled job
  # is neither a pass nor a failure, and it is the worst of the three to merge on**
  # ([[a-cancelled-ci-job-is-not-a-failed-assertion]]: `gh pr checks` prints
  # "fail" for both, and this repository merged red once on that confusion).
  # ⚠️ Jobs run in parallel, so this costs wall-clock nothing.
  #
  # ⚠️⚠️ WHAT IT GUARDS (plan task `5h-ii-a`): THE FIRST **TO-MANY** EMBED OVER A
  # **COMPOSITE** FOREIGN KEY IN THIS APP. Every other embed here is to-ONE and read
  # FROM the line — `purchase!inner(…)`, `family(…)`. `app/src/api/documents.ts`
  # starts at the DOCUMENT and asks for its LINES, and four of its claims are
  # **200-and-wrong rather than red**, with nothing but a real PostgREST able to see
  # any of them:
  #
  #   * the embed resolving at all, rather than 400-ing on an ambiguous relationship;
  #   * `::text` surviving INSIDE it — and on `qty_display` that failure is nearly
  #     invisible, because the double `3` renders as `3 kg` and only a fractional
  #     quantity gives it away;
  #   * a parent `limit` counting DOCUMENTS rather than joined rows, so
  #     `DOCUMENTS_LIMIT` never renders a delivery with some of its lines — the one
  #     failure on this screen a shopkeeper would act on and could not detect;
  #   * and PostgREST sorting the lines by a NESTED embedded column, which it MUST,
  #     because **nothing in this schema records the order she keyed them in**: there
  #     is no ordinal column and `created_at` is identical across every line of one
  #     document, so an unordered embed returns heap order and reshuffles on a
  #     re-plan with nothing going red.
  #
  # ⚠️ It also asserts an Empleada reads both kinds, HEADERS AND LINES. She is the
  # person who keys the deliveries, and before `0040` her purchase read was **200
  # and an empty array** — never a 403 — which on this screen is every document
  # present and every one apparently empty.
  # ===========================================================================
  # ⚠️ THE KEY IS `recent-documents` AND NOT `documents`, WHICH IS NOT FUSSINESS:
  # `app.yml` ALREADY HAS A JOB KEYED `documents` — *the documents still agree (plan
  # + handbook)* — and two jobs of that name mean completely unrelated things. The
  # working agreement says to **confirm the checks by name in the log**, and two
  # identically-keyed jobs is exactly how that reading goes wrong.
  # ⚠️⚠️ `5h-ii-b` APPENDED TWO STEPS HERE ON 2026-09-26 RATHER THAN OPENING A
  # SIXTH JOB, AND THE JOB'S NAME MOVED WITH THEM. The split precedent in this
  # workflow is about the CAP — `catalog-write` was running 12-13 minutes against
  # fifteen — and this job was measured at well under a minute for its two steps.
  # ⚠️ **But a job whose name describes half of what it runs is the stale-claim
  # defect**, and the working agreement says to confirm the checks BY NAME in the
  # log, so the name says both. The KEY is unchanged, so nothing that addresses
  # this job by key moves.
  # ⚠️ They also share every fixture this job already pays for — a shop, a catalog,
  # a supplier, and people signed up through a rate-limited GoTrue.
  recent-documents:
    name: the list every correction is reached from, and the correction
    runs-on: ubuntu-latest
    # ⚠️⚠️ FIFTEEN, LIKE EVERY OTHER JOB HERE, AND THE NUMBER BEHIND IT IS MEASURED
    # RATHER THAN GUESSED — because the first version of this comment said *roughly
    # seven minutes* and set the cap to twenty, and that was a guess off the fixture
    # count. **Measured on 2026-09-26: the ten-fixture harness runs in 18.7 seconds
    # and the check itself in about ten**, even though the harness drives the whole
    # live check ten times, because each run reuses a warm GoTrue.
    # ⚠️ WHAT CAN MAKE IT SLOW IS NOT THE FIXTURES, IT IS SIGNUP: GoTrue rate-limits
    # and answers with an EMPTY BODY rather than a 429, so the retry loop inside the
    # check sleeps ten seconds a try, six tries, three people per run. A cold or
    # throttled runner is where the minutes would come from, and fifteen leaves room
    # for it.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned for `reset`'s reason: a CLI release must not turn a green
          # schema red without a commit saying why.
          version: 2.114.0

      # ⚠️ `db`, `auth`, `rest` AND THE GATEWAY ARE ALL THIS NEEDS — the check signs
      # three people up through GoTrue and reads through PostgREST, both via Kong.
      # The exclusion list is `catalog-write`'s, for its reason.
      - name: Start Postgres, GoTrue and PostgREST
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Apply migrations from scratch
        run: supabase db reset

      # ⚠️⚠️ THE ONLY THING ANYWHERE THAT CAN SEE A TO-MANY EMBED OVER A COMPOSITE
      # FOREIGN KEY RESOLVING — the first of either in this app — and the only
      # thing that can see `::text` surviving inside one. ⚠️ On `qty_display` that
      # failure is nearly invisible: the double `3` renders as `3 kg` and only a
      # fractional quantity gives it away. ⚠️ It also drives a read with NO line
      # order in the same run and shows it answers a DIFFERENT order, so
      # "alphabetical" is a measurement rather than a coincidence of the planner.
      - name: Contract — does app/src/api/documents.ts still describe the schema (plan 5h-ii-a)
        run: bash docs/checks/5h-ii-a-documents-contract.sh

      # ⚠️ Ten fixtures: a green control, eight mutated copies of the app's own
      # contract module, and one that puts back the manager fence `0040` removed.
      # ⚠️⚠️ `F1` and `F5` are the two it exists for — the cast inside the embed,
      # and the line order spelled as a bare column, which is the edit a reader who
      # has just learned `COSTS_ORDER`'s lesson would make and is the WRONG lesson
      # for a to-many embed. ⚠️ The live check paid for itself three times before
      # this harness existed: `record_sale` takes `unit_price_gross_per_base`,
      # `0018:222` clamps `occurred_at` to 72 hours (so no fixture can be outside a
      # seven-day window), and `0021:316` stamps a reversal at the moment of the
      # VOID rather than of the document it cancels.
      # ⚠️ The restore is in a `trap` on every exit path, read out of `pg_policies`
      # rather than remembered.
      - name: Contract — can the documents check still fail (its own ten fixtures)
        run: bash docs/checks/5h-ii-a-documents-contract-falsify.sh

      # ⚠️⚠️ THE FIRST WRITE IN THIS APP THAT CANCELS ANYTHING (plan `5h-ii-b`), and
      # every claim in it is one no node suite and no typecheck can make: the RPC's
      # three `p_` names against the applied `0021` (a mismatch is a **404**, not a
      # bad call); `TD003` arriving as the code on an HTTP **400**, which is what
      # `@/api/errors` turns into *pídele a un gerente*; a replay answering a
      # SHORTER body than a first void, which is why `voidedFrom` reads three keys;
      # the fence in all four of its cases, so a client fence drawn too WIDE goes
      # red as loudly as one drawn too narrow; the window read live out of
      # `workspace_setting` rather than hardcoded; and ⚠️⚠️ **a voided delivery
      # re-recording without a `payload_hash` collision, which is the whole of
      # `Corregir`** — if that were a `TD001` this app would cancel a delivery and
      # refuse to put it back, with nothing able to see it until a shopkeeper stood
      # in it.
      - name: Contract — does app/src/api/corrections.ts still describe the schema (plan 5h-ii-b)
        run: bash docs/checks/5h-ii-b-corrections-contract.sh

      # ⚠️ Nine fixtures: a green control, five mutated copies of the app's own
      # contract, and three that break the DATABASE — an accent-stripping trigger,
      # a trigger that pins the void window so narrowing it is a silent no-op, and
      # `void_transaction`'s grant revoked. All three are schema-level and restored
      # in a `trap` on every exit path, which is forced rather than stylistic: the
      # check builds its own shop INSIDE the run, so a mutation to a ROW would be a
      # mutation to a shop the run never sees.
      # ⚠️⚠️ `F4`'s FIRST VERSION WAS NOT A FALSIFICATION AND THE FILE SAYS SO: it
      # mutated `src/strings.ts`, which the check READS to build its payload, so
      # both halves of the comparison moved and the check stayed green. Output
      # compared against its own input is self-consistent and blind.
      - name: Contract — can the corrections check still fail (its own nine fixtures)
        run: bash docs/checks/5h-ii-b-corrections-contract-falsify.sh

      - name: Stop
        if: always()
        run: supabase stop --no-backup

  # ===========================================================================
  # ⚠️⚠️ THE SIXTH JOB, ADDED BY `6a-i` (2026-09-27) — AND IT IS A NEW JOB RATHER
  # THAN TWO MORE STEPS ON `recent-documents`, WHICH IS THE OPPOSITE OF WHAT
  # `5h-ii-b` DID. That row appended to an existing job because it was measured
  # well under the cap and because a correction is *the thing you reach from the
  # list* — one concern. **This is a WRITE and that job is a READ**: they fail for
  # different reasons (*this app cannot record a loss* vs *this app cannot read a
  # document back*), and `5h-ii-b`'s own entry records the cost of the alternative
  # — it had to RENAME the job it joined, because *a job whose name describes half
  # of what it runs is the stale-claim defect.*
  # ⚠️⚠️ RENAMED BY `6a-ii-a` (2026-09-27) WHEN IT APPENDED TWO STEPS, WHICH IS
  # `5h-ii-b`'s OWN LESSON OBEYED: *a job whose name describes half of what it runs
  # is the stale-claim defect.* ⚠️ **The KEY stays `waste`**, so anything addressing
  # this job by key is unbroken — `recent-documents` did exactly this when it was
  # renamed the day it was created.
  #
  # ⚠️⚠️ AND APPENDING RATHER THAN OPENING A SEVENTH JOB IS A MEASURED DECISION AND
  # NOT A PREFERENCE, WHICH IS THE ARGUMENT THIS COMMENT BLOCK MAKES ONE WAY AND
  # THEN THE OTHER. `6a-i` opened this job rather than joining `recent-documents`
  # because a WRITE and a READ fail for different reasons. `6a-ii-a` is a READ —
  # so by that argument it belonged with `recent-documents` — **and the two things
  # that decided it are a shared fixture and the clock.**
  #
  # The two checks build the IDENTICAL fixture: sign up an owner, onboard a shop,
  # create a family and variants, stock them through `record_purchase`, invite an
  # Empleada, and call `record_waste`. That is one subject — Desperdicio over the
  # wire — where `recent-documents` builds deliveries and sales and never touches a
  # cause. ⚠️ **And a seventh job would re-pay `supabase start` + `db reset`, which
  # is the DOMINANT cost here** (minutes) to run seconds of new assertions.
  #
  # ⚠️ MEASURED LOCALLY 2026-09-27, which is what turned that into a decision:
  # `6a-i`'s pair runs 3s + 19s and `6a-ii-a`'s runs 3s + 35s. The falsifiers are
  # what cost, because each one drives the whole live check a dozen times and every
  # run signs two or three people up through a rate-limited GoTrue.
  waste:
    # ⚠️⚠️ THE NAME MOVED AGAIN WITH `6a-ii-b` AND THE **KEY** DID NOT — `5h-ii-b`'s
    # rule, twice applied now: *a job whose name describes half of what it runs is
    # the stale-claim defect.* This job now also puts a write-off right, so the name
    # says so and everything addressing it by key is untouched.
    name: the loss, the cause it is filed under, reading it back and putting it right
    runs-on: ubuntu-latest
    # ⚠️ FIFTEEN, LIKE EVERY OTHER JOB HERE, AND THE NUMBER BEHIND IT IS MEASURED
    # RATHER THAN GUESSED. **Measured 2026-09-27: `6a-i`'s check in about 12 seconds
    # and its ten-fixture harness in 105**, because a harness drives the whole live
    # check a dozen times and each run signs two people up.
    # ⚠️⚠️ **`6a-ii-a` ADDED A SECOND PAIR THE SAME DAY and it is the slower of the
    # two**: locally 3s + 35s against `6a-i`'s 3s + 19s, because its harness runs
    # eleven fixtures and each one signs THREE people up. Scaling the local ratio
    # puts the four steps at roughly five minutes of assertions, so the cap still
    # has real headroom — **and the reason to say so is `catalog-write`, which runs
    # 12-13 minutes against this same fifteen and was CANCELLED three times on
    # `main` before it was split. A cancelled job is neither a pass nor a failure.**
    # ⚠️ **`6a-ii-b` ADDED A THIRD PAIR (2026-09-27) AND IT IS THE CHEAPEST OF THE
    # THREE**: locally 2.5s + 16s, because its harness runs eight fixtures rather
    # than eleven and each run signs only TWO people up — the outsider `6a-ii-a`
    # needs for its tenancy wall is not a fixture this one has any use for.
    # ⚠️ WHAT MAKES IT SLOW IS NOT THE FIXTURES, IT IS SIGNUP: GoTrue rate-limits
    # and answers with an EMPTY BODY rather than a 429, so the retry loop inside the
    # check sleeps ten seconds a try, six tries, two people per run. A cold or
    # throttled runner is where the minutes would come from, and fifteen leaves room.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned for `reset`'s reason: a CLI release must not turn a green
          # schema red without a commit saying why.
          version: 2.114.0

      # ⚠️ `db`, `auth`, `rest` AND THE GATEWAY ARE ALL THIS NEEDS — the check signs
      # two people up through GoTrue and reads through PostgREST, both via Kong.
      # The exclusion list is `catalog-write`'s, for its reason.
      - name: Start Postgres, GoTrue and PostgREST
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Apply migrations from scratch
        run: supabase db reset

      # ⚠️⚠️ `record_waste` (`0019`) WAS APPLIED ON 2026-09-05 AND CALLED BY NOTHING
      # IN `app/` FOR TWENTY-TWO DAYS. This is the first thing anywhere that drives
      # it from the app's own contract, and three of its claims were 200-and-wrong
      # until they were measured: **the enum's order is DECLARATION order and not
      # alphabetical**, so the picker's order and a reason breakdown's are the same
      # order or nothing can see that they differ; **the default `qty_display_unit`
      # is the SELL unit**, so `2` with no unit became two KILOS of a gram-based
      # variant; and **an Empleada reading her own waste document gets an HTTP 200
      # with an empty `waste_line` array**, because `waste_line_select` carries a
      # manager gate that `waste_select` does not — the only asymmetric pair in this
      # schema, and the reason `6a-ii` needs a migration rather than a patch.
      - name: Contract — can this app record a loss (plan 6a-i)
        run: bash docs/checks/6a-i-waste-contract.sh

      # ⚠️ Ten fixtures: two green controls, seven mutated copies of the app's own
      # contract modules, and one that DROPS `waste_line_select`'s role gate.
      # ⚠️⚠️ `F2` and `F8` are the two it exists for. `F2` sorts `WASTE_REASONS`
      # alphabetically — every cause still legal, every write still landing, and the
      # only thing wrong is an order the database will never sort into, which
      # nothing else here can see. `F8` publishes `unit_cost_net_per_base` to every
      # member, which is the migration somebody would write to "fix" a cashier
      # seeing a waste document with no products; `0040` kept that fence
      # manager-and-above BY NAME.
      # ⚠️ The policy restore is read out of `pg_policies` rather than remembered,
      # runs in a `trap` on every exit path, and is re-proved by a second control.
      - name: Contract — can the waste check still fail (its own ten fixtures)
        run: bash docs/checks/6a-i-waste-contract-falsify.sh

      # ⚠️⚠️ AND THE OTHER HALF, `6a-ii-a`: CAN THE PERSON WHO RECORDED THE LOSS
      # READ IT BACK? Until `0041` she could not — `waste_select` admits every
      # member and `waste_line_select` carries `has_role(…, 'manager')`, so her own
      # write-off came back as **HTTP 200 with `"waste_line": []`**, a document with
      # no products rather than a refusal. `0041` is a `security definer` view that
      # reaches AROUND that fence, and the step above is what keeps the fence honest
      # while this one exists beside it.
      #
      # ⚠️⚠️ THE CLAIMS ONLY THIS CAN MAKE, because a definer view has no policy and
      # `supabase/pgtap/01_rls_coverage.sql` joins `relkind = 'r'`: that the view's
      # `where` clause really is its tenancy wall (a DIFFERENT shop's owner reads
      # ZERO), that no projection of it yields a cost (every money column is a
      # `42703`, not a value), that `::text` survives an embed on a VIEW, and that a
      # to-many embed can be ordered on TWO keys — which one document holding the
      # same product under two causes needs, and which was unmeasured when the row
      # was written.
      - name: Contract — can a cashier read the loss she recorded (plan 6a-ii-a)
        run: bash docs/checks/6a-ii-a-waste-list-contract.sh

      # ⚠️ Eleven fixtures: two green controls, six mutated copies of
      # `app/src/api/documents.ts`, and THREE that break `0041` itself.
      # ⚠️⚠️ `D1` is the one this pair exists for — the view flipped to
      # `security_invoker = true`, which is the edit a reader makes to bring it
      # "into line with §2.7" and which leaves it EMPTY for the only person it
      # exists for. `D2` drops the tenancy predicate, which hands every write-off in
      # the database to any signed-in user with nothing in Postgres objecting.
      # `D3` puts `unit_cost_net_per_base` back, which is one line and reads like a
      # feature.
      # ⚠️ The view restore is read out of `pg_get_viewdef` rather than remembered,
      # runs in a `trap` on every exit path, and is re-proved by a second control.
      - name: Contract — can the list check still fail (its own eleven fixtures)
        run: bash docs/checks/6a-ii-a-waste-list-contract-falsify.sh

      # ⚠️⚠️ AND PUTTING ONE RIGHT — plan task `6a-ii-b`, APPENDED to this job for
      # `6a-ii-a`'s reason rather than opened as a tenth: the two build the same
      # fixture (one shop, one Empleada, Desperdicio over the wire) and a job of its
      # own would re-pay `supabase start` + `db reset` — the dominant cost — to run
      # seconds of new assertions.
      #
      # ⚠️⚠️ THE TWO CLAIMS THAT LIVE ONLY HERE. **`void_transaction` takes
      # `'waste'`** — applied since 2026-09-04 and never once sent that argument,
      # and it matters more on this kind than the other two because a cashier cannot
      # read her own waste LINES at all, so a void that touched them would refuse
      # her. And **the cause that comes back is a cause that can go back**: the view
      # hands over an enum member, `record_waste` refuses the capitalised word with
      # `22P02`, and that refusal is what makes the app carrying both `cause` and
      # `causeValue` a measured requirement rather than a preference.
      - name: Contract — can a cashier put her own write-off right (plan 6a-ii-b)
        run: bash docs/checks/6a-ii-b-waste-correction-contract.sh

      # ⚠️ Eight fixtures: two green controls, five mutated copies of the app's
      # contract modules, and one that revokes `execute` on `void_transaction` from
      # `authenticated`.
      # ⚠️⚠️ `F5` is the one it exists for — the cause dropped from the line list.
      # The read stays a 200, every quantity is right, and `causeValue` is `null` on
      # every write-off, so `Corregir` lands her on Desperdicio with the opening
      # question unanswered. ⚠️ `D1` is the other: `0021:448` grants execute, the
      # plan spent a day believing no path to a void existed, and **no pgTAP suite
      # asserts a function's ACL.**
      # ⚠️ The grant is restored from `pg_proc` rather than remembered, runs in a
      # `trap` on every exit path, and is re-proved by a second control.
      - name: Contract — can the correction check still fail (its own eight fixtures)
        run: bash docs/checks/6a-ii-b-waste-correction-contract-falsify.sh

      - name: Stop
        if: always()
        run: supabase stop --no-backup

  # ===========================================================================
  # ⚠️⚠️ THE SEVENTH JOB, ADDED BY `6b` (2026-09-27) — AND IT IS A NEW JOB RATHER
  # THAN TWO MORE STEPS, WHICH IS THE OPPOSITE OF WHAT `6a-ii-a` AND `6a-ii-b` BOTH
  # DID. Both of those appended, and the argument each made was that it shared the
  # IDENTICAL fixture with the steps already in its job. This one does not, and the
  # two candidates fail the test for different reasons:
  #
  #   * `catalog-write` is where the manager-fence precedent lives and where
  #     `5g-i`'s provider fixture already is — and **it runs 12-13 minutes against
  #     its own `timeout-minutes: 15` and was CANCELLED THREE TIMES on `main`**
  #     before `5R-g` split it. Appending to a job that close to its cap is how a
  #     cancellation becomes deterministic, and ⚠️ **a cancelled job is neither a
  #     pass nor a failure, and it is the worst of the three to merge on**
  #     ([[a-cancelled-ci-job-is-not-a-failed-assertion]]: `gh pr checks` prints
  #     "fail" for both, and this repository merged red once on that confusion).
  #   * `recent-documents` builds a shop, a catalog, a supplier and two people —
  #     genuinely close — but its NAME already covers two unrelated things, and the
  #     working agreement says to confirm the checks BY NAME in the log. A third
  #     subject would make that name describe a third of what it runs, which is the
  #     stale-claim defect `5h-ii-b` named when it renamed `waste`.
  #
  # ⚠️ Jobs run in parallel, so this costs wall-clock nothing — `5R-g` measured that
  # the split was better than free.
  #
  # ⚠️⚠️ WHAT IT GUARDS (plan task `6b`): THE FIRST `provider` WRITE THIS APP HAS
  # EVER MADE, twenty-five days after it started reading them. Three of its claims
  # exist nowhere else in this repository:
  #
  #   * **A CASHIER IS REFUSED TWO DIFFERENT WAYS AND ONLY ONE OF THEM IS AN ERROR.**
  #     `provider_insert` refuses her outright — HTTP 403 `42501`. `provider_update`
  #     makes the row INVISIBLE through its `using` clause, so her PATCH is **200
  #     with `[]`** and `.select().single()` is the only thing that turns it into
  #     something an app can act on ([[rls-update-refusal-is-a-200]]). No typecheck,
  #     suite or bundler has ever read a policy, `CREATE POLICY` is not in the
  #     knowledge graph, and RLS is bypassed by the `postgres` superuser — so a
  #     check run as superuser would pass vacuously.
  #   * **`normalize_name` FOLDS CASE AND WHITESPACE AND NOT ACCENTS**, driven both
  #     ways: `bodega   DEL centro` is refused `23505` and `Abarrotes Pena` beside
  #     `Abarrotes Peña` is **accepted**. The second half is why `checkProvider` is
  #     deliberately STRICTER than its own schema, and if the database ever started
  #     refusing it, that comment would have become false with nothing to say so.
  #   * **THE GENERIC ROW CAN STILL BE DEACTIVATED.**
  #     `provider_protect_generic` refuses a DELETE and a demotion and **stops
  #     there** — so `canRetire` in the client is the only fence there is, and a
  #     client-only fence nobody has written down is a control the next session
  #     deletes. ⚠️ The check switches it back on immediately.
  #
  # ⚠️ MEASURED LOCALLY 2026-09-27 rather than guessed: the check runs in about 12
  # seconds and its ten-fixture harness in about 140, because a harness drives the
  # whole live check a dozen times and every run signs THREE people up through a
  # rate-limited GoTrue. Scaling that puts the two steps well inside the cap.
  providers:
    name: the provider directory, and the manager fence on it
    runs-on: ubuntu-latest
    # ⚠️ FIFTEEN, LIKE EVERY OTHER JOB HERE. ⚠️ WHAT MAKES A JOB LIKE THIS SLOW IS
    # NOT THE FIXTURES, IT IS SIGNUP: GoTrue rate-limits and answers with an EMPTY
    # BODY rather than a 429, so the retry loop inside the check sleeps ten seconds a
    # try, six tries, three people per run. A cold or throttled runner is where the
    # minutes would come from, and fifteen leaves room.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned for `reset`'s reason: a CLI release must not turn a green
          # schema red without a commit saying why.
          version: 2.114.0

      # ⚠️ `db`, `auth`, `rest` AND THE GATEWAY ARE ALL THIS NEEDS — the check signs
      # three people up through GoTrue and reads and writes through PostgREST, both
      # via Kong. The exclusion list is `catalog-write`'s, for its reason.
      - name: Start Postgres, GoTrue and PostgREST
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Apply migrations from scratch
        run: supabase db reset

      # ⚠️⚠️ `provider` HAS BEEN IN THIS SCHEMA SINCE `0002` (2026-09-02) AND NOTHING
      # IN `app/` HAD EVER WRITTEN A ROW TO IT. `5g-i` reads the list for Comprar's
      # picker; `5g-iii` reads a name onto a cost chart; this is the first insert and
      # the first patch, so `provider_insert` and `provider_update` have never been
      # exercised from the app's own constants at all.
      # ⚠️ It also asserts the OTHER side of `5g-i`'s banned-column boundary: those
      # three directory columns must be on `DETAIL_COLUMNS` and must NOT be on
      # `PROVIDER_COLUMNS`, so a session widening the list read to save a query goes
      # red in two checks rather than shipping a decision about who sees what.
      - name: Contract — does app/src/api/providerDirectory.ts still describe the schema (plan 6b)
        run: bash docs/checks/6b-provider-directory-contract.sh

      # ⚠️⚠️ AND THE HARNESS, WHICH FOUND TWO OF ITS OWN FIXTURES UNCATCHABLE ON ITS
      # FIRST RUN AND SAID SO. One added `is_generic` to the insert body, which
      # Postgres accepts happily; one made `optional()` return `''` instead of
      # `null`, and **no shell script can call a TypeScript function.** Both claims
      # belong to `app/test/api-provider-directory.test.ts`, the check gained an
      # assertion about the CONSEQUENCE of the second, and the replacements break
      # something on the wire. ⚠️ Its two database fixtures re-create
      # `provider_select` and `provider_update` from `pg_policy` rather than from a
      # copy in the harness, and put them back in a `trap` on every exit path.
      - name: Contract — can the provider check still fail (its own ten fixtures)
        run: bash docs/checks/6b-provider-directory-contract-falsify.sh

      - name: Stop
        if: always()
        run: supabase stop --no-backup

  # ===========================================================================
  # ⚠️⚠️ THE EIGHTH JOB, ADDED BY `6c` (2026-09-27) — AND IT IS A NEW JOB FOR THE
  # NARROWEST REASON OF ANY OF THEM: THE OBVIOUS HOME IS ALREADY AT ITS CAP.
  #
  # `catalog-write` is not merely a plausible home, it is the RIGHT one on every test
  # this workflow has ever used — it already runs
  # `docs/checks/5e-iii-a-catalog-edit-contract.sh` against the very file `6c` widens,
  # `app/src/api/catalogEdit.ts`, and it builds the identical fixture (a shop, a
  # manager, a cashier, a family, a variant). `6a-ii-a` and `6a-ii-b` both appended on
  # exactly that argument.
  #
  # ⚠️⚠️ AND IT CANNOT BE USED, BECAUSE IT RUNS 12-13 MINUTES AGAINST ITS OWN
  # `timeout-minutes: 15` AND WAS CANCELLED THREE TIMES ON `main` BEFORE `5R-g` SPLIT
  # IT. Appending a check and a seven-fixture harness to a job that close to its cap is
  # how a cancellation becomes deterministic — and ⚠️ **a cancelled job is neither a
  # pass nor a failure, and it is the worst of the three to merge on**
  # ([[a-cancelled-ci-job-is-not-a-failed-assertion]]: `gh pr checks` prints "fail" for
  # both, and this repository merged red once on that confusion).
  #
  # ⚠️ So the seam is the CAP and not the subject, which is `5R-g`'s own reason and
  # the fifth job's. Jobs run in parallel, so this costs wall-clock nothing.
  #
  # ⚠️⚠️ WHAT IT GUARDS (plan task `6c`): `0042`, WHICH MINTS THE ONE COLUMN THAT SAYS
  # WHETHER A PRODUCT IS THE SHOP'S TO REMOVE. Five of its claims exist nowhere else
  # in this repository:
  #
  #   * **`restrict_violation` IS AN HTTP 400 WITH CODE `23001`** — not a 403 and not a
  #     409. A trigger's exception is neither a privilege error nor a uniqueness
  #     conflict, and `catalogEditErrorMessage` keys on that string. The SQL suite
  #     `supabase/tests/0042_catalog_origin.sql` sees SQLSTATE 23001 and no HTTP status
  #     at all ([[custom-sqlstate-arrives-as-400]]).
  #   * **FINDING 1, DRIVEN: A PREBUILT PRODUCT IS STILL RENAMED AND REPRICED.** The
  #     obvious spelling of `0042` puts `is_prebuilt = false` into
  #     `product_variant_update`'s `using` clause. It reads correctly, it refuses the
  #     retire, and it also stops the shopkeeper PRICING an imported product — which is
  #     the entire reason for importing one. It would have merged automatically, and
  #     nothing in `app/` would have gone red, because a `using` clause makes the row
  #     INVISIBLE rather than refusing the write ([[rls-update-refusal-is-a-200]]).
  #     The harness's `D1` is that migration, as a fixture.
  #   * **`is_prebuilt` ARRIVES AS A JSON BOOLEAN.** The two figures beside it in
  #     `VARIANT_EDIT_COLUMNS` are `::text` casts; a cast added to this one for
  #     consistency hands `canRetireProduct` the string `'false'`, which is TRUTHY, and
  #     hides the retire control on every product the shop made. No typecheck and no
  #     Vitest fixture can read a JSON type off the wire.
  #   * **THE ASYMMETRY: A PROMOTION IS ALLOWED AND A DEMOTION IS NOT.** Nothing can
  #     mark a row prebuilt except an INSERT that says so or that PATCH, so fencing both
  #     directions leaves the onboarding this whole row exists for with no way in —
  #     which is what the first writing of `0042` did, found by driving it.
  #   * **A CASHIER'S RETIRE IS SILENT AND NOT `23001`.** Her PATCH never reaches the
  #     trigger, because `product_variant_update` excludes the row. RLS is bypassed by
  #     the `postgres` superuser, so a check run as superuser passes this vacuously.
  #
  # ⚠️ MEASURED LOCALLY 2026-09-27 rather than guessed: the check runs in about 15
  # seconds and its seven-fixture harness in about 150, because the harness drives the
  # whole live check eight times and every run signs TWO people up through a
  # rate-limited GoTrue. Scaling that puts both steps well inside the cap — which is
  # the measurement that says this job is nowhere near the cliff `catalog-write` is on.
  catalog-origin:
    name: the prebuilt catalog, and the delete that depends on it
    runs-on: ubuntu-latest
    # ⚠️ FIFTEEN, LIKE EVERY OTHER JOB HERE — and `providers`' note applies verbatim:
    # what makes a job like this slow is not the fixtures, it is GoTrue's signup rate
    # limit answering with an EMPTY BODY rather than a 429.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned for `reset`'s reason: a CLI release must not turn a green
          # schema red without a commit saying why.
          version: 2.114.0

      # ⚠️ `db`, `auth`, `rest` AND THE GATEWAY ARE ALL THIS NEEDS. The exclusion list
      # is `catalog-write`'s, for its reason.
      - name: Start Postgres, GoTrue and PostgREST
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Apply migrations from scratch
        run: supabase db reset

      # ⚠️⚠️ AND `supabase/tests/0042_catalog_origin.sql` IS **NOT** RUN HERE, WHICH IS
      # THE CONVENTION AND NOT AN OMISSION: the `reset` job's *Behavioural checks* step
      # runs the whole of `supabase/tests/` in name order, each suite preceded by
      # `_cleanup.sql`, so a new suite costs no edit to this workflow at all — which is
      # what the header at the top of this file means by *"a third suite costs no edit
      # here"*. Running it here too would re-pay
      # `supabase start` plus TWO `db reset`s — `_cleanup.sql` truncates the seed the
      # live check needs — to assert something already asserted in the same run.
      #
      # ⚠️ ITS §2 IS WORTH NAMING ANYWAY, BECAUSE IT IS THE ONLY PLACE THE OWNER'S
      # BACKFILL RULING OF 2026-09-24 IS VISIBLE: `0042` writes no `update` — an
      # `update` would stamp `updated_at` on every row in every shop — so no ROW in a
      # fresh database witnesses it, and `pg_attribute.attmissingval` is what records
      # that a row predating the column is OURS.
      - name: Contract — is the fence on a prebuilt product real over HTTP (plan 6c)
        run: bash docs/checks/6c-catalog-origin-contract.sh

      # ⚠️⚠️ AND THE HARNESS, WHICH CAUGHT A DEFECT IN ITSELF ON ITS FIRST RUN. Its
      # restore used to feed `pg_get_functiondef`'s output through an UNQUOTED heredoc,
      # where `$function$` expands to `$` — psql failed, `ON_ERROR_STOP=1` aborted
      # before the `create trigger` on the next line, and `D3` then measured a database
      # with no trigger at all and went red for the wrong reason. **It said so, which is
      # the only thing that could have found it.** The restore now pipes the body,
      # issues each statement separately, and VERIFIES the database went back.
      - name: Contract — can the fence check still fail (its own seven fixtures)
        run: bash docs/checks/6c-catalog-origin-contract-falsify.sh

      # THE STARTER CATALOG'S IMPORT (docs/PLAN.md 9d), over the same reset: the
      # app's two RPC names and three `p_` arguments against `0044`, the template
      # holding `0045`'s Pollería, the schema closed (406 PGRST106), the import
      # landing once minus what was unticked, and a cashier refused (403 42501).
      - name: The starter catalog's import, against the app's own names (9d)
        run: bash docs/checks/9d-starter-catalog-contract.sh

      # Each fixture hands the check a broken COPY of an app module and must turn
      # it red FOR ITS REASON — a check that can only pass asserts nothing.
      - name: Falsify it — four broken copies, each red for its reason
        run: bash docs/checks/9d-starter-catalog-contract-falsify.sh

      - name: Stop
        if: always()
        run: supabase stop --no-backup

  # ===========================================================================
  catalog-write:
    name: the catalog write, and the manager fence on it
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned for `reset`'s reason: a CLI release must not turn a green
          # schema red without a commit saying why.
          version: 2.114.0

      # ⚠️ `db`, `auth`, `rest` AND THE GATEWAY ARE ALL THIS NEEDS — the
      # instrument signs two people up through GoTrue and posts rows through
      # PostgREST, both via Kong. The exclusion list is `auth-session`'s, for
      # its reason: bringing up the rest is a minute of start-up for containers
      # nothing here touches.
      - name: Start Postgres, GoTrue and PostgREST
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Apply migrations from scratch
        run: supabase db reset

      - name: Contract — does app/src/api/catalogWrite.ts still describe the schema (plan 5e-i)
        run: bash docs/checks/5e-i-catalog-write-contract.sh

      # And its own fifteen fixtures. ⚠️ SIX BREAK THE CONTRACT — a renamed
      # column, a reordered write, an unmapped refusal code, a constraint the
      # app keys on that no longer fires, an unreadable contract — and FIVE MOVE
      # THE APPLIED SCHEMA and put it back, because neither insert policy, the
      # foreign key, the uniqueness nor the tax default can be falsified by any
      # edit to a TypeScript file. ⚠️ Each restore is in a `trap` that runs on
      # every exit path: a harness that left a WIDENED policy behind would make
      # the tree look safe when it is not.
      - name: Contract — can the catalog write check still fail (its own fifteen fixtures)
        run: bash docs/checks/5e-i-catalog-write-contract-falsify.sh

      - name: Contract — does app/src/api/catalogEdit.ts still describe the schema (plan 5e-iii-a)
        run: bash docs/checks/5e-iii-a-catalog-edit-contract.sh

      # ⚠️ And its own ten fixtures, every one of them a MUTATED COPY of the app's
      # contract module rather than an edit to the schema — which is what lets this
      # harness leave nothing behind. ⚠️ Two of them move the codes the manager
      # fence arrives as, and those are the ones worth reading: `A CASHIER IS
      # REFUSED` is now a claim about a 403 AND about a silent 200, and a harness
      # that could not break both would be watching half of it.
      - name: Contract — can the catalog edit check still fail (its own ten fixtures)
        run: bash docs/checks/5e-iii-a-catalog-edit-contract-falsify.sh

      # ⚠️⚠️ THE FIRST ROUND TRIP THIS REPOSITORY HAS EVER MADE AGAINST
      # `record_purchase`, and the only instrument that can see the cashier
      # asymmetry Comprar is designed around. See the path filter above.
      - name: Contract — does app/src/api/providers.ts still describe the schema (plan 5g-i)
        run: bash docs/checks/5g-i-purchase-contract.sh

      # ⚠️ Eleven fixtures: a green control, seven mutated copies of the app's
      # own contract module, and THREE that move applied SQL and put it back —
      # because narrowing `provider_select`, widening the two policies the memory
      # view joins across, and renaming the seeded generic provider are all
      # invisible to every TypeScript edit. ⚠️ Each restore is in a `trap` that
      # runs on every exit path.
      - name: Contract — can the purchase check still fail (its own eleven fixtures)
        run: bash docs/checks/5g-i-purchase-contract-falsify.sh

      # ⚠️⚠️ THE ONLY THING ANYWHERE THAT CAN SEE A SORT SPELLING WHICH IS A
      # SILENT NO-OP. See the path filter above for why that matters. It drives
      # the right spelling AND the wrong one in the same run, so it does not
      # merely confirm the right answer — it exhibits the wrong one.
      - name: Contract — does app/src/api/costs.ts still describe the schema (plan 5g-iii)
        run: bash docs/checks/5g-iii-costs-contract.sh

      # ⚠️ Ten fixtures: two green controls (one at each end, so the last one
      # proves the policy restore took), seven mutated copies of the app's own
      # contract module, and one that puts back the manager fence `0040`
      # removed — because a policy that allows less breaks no test and a policy
      # that allows more breaks no test either. ⚠️⚠️ Its OWN first run found three
      # defects in the check rather than in the app, which is recorded in its
      # header: one fixture went green, one was red for the wrong reason, and one
      # was vacuous and is deleted. ⚠️ The restore is in a `trap` on every exit
      # path, and it is read out of `pg_policies` rather than remembered.
      - name: Contract — can the costs check still fail (its own ten fixtures)
        run: bash docs/checks/5g-iii-costs-contract-falsify.sh

      # ⚠️⚠️ THE ONLY THING ANYWHERE THAT CAN SEE `qty_base` ARRIVING AS A DOUBLE,
      # and the failure it catches is the silent kind — the guard stops speaking
      # rather than speaking wrongly. It also drives the `{ referencedTable }`
      # spelling in the same run to show the order really is being applied to the
      # parent, because here the order is what `limit` slices.
      - name: Contract — does app/src/api/magnitude.ts still describe the schema (plan 5f.5)
        run: bash docs/checks/5f.5-magnitude-contract.sh

      # ⚠️ Eight fixtures: a green control, six mutated copies of the app's own
      # contract module, and one that puts back the manager fence `0040` removed
      # — because with it back a cashier reads 200 and an EMPTY ARRAY, never a
      # 403, so §2.8's guard is silently dead for the one role the ADR names and
      # nothing else in this repository goes red. ⚠️⚠️ `F4` is a defect the live
      # check found in the app on its first run, kept: PostgREST refuses to order
      # a parent by an embedded column that is not in the embed's select list,
      # and `occurred_at` is the one column in that contract nothing reads.
      # ⚠️ The restore is in a `trap` on every exit path, read out of
      # `pg_policies` rather than remembered.
      - name: Contract — can the magnitude check still fail (its own eight fixtures)
        run: bash docs/checks/5f.5-magnitude-contract-falsify.sh

      - name: Stop
        if: always()
        run: supabase stop --no-backup

  # ⚠️⚠️ THIS JOB WAS BEING CANCELLED AT ITS OWN TIMEOUT, AND `5R-g` SPLIT IT ON
  # 2026-09-24. THE STOPGAP IS GONE AND THE CAP IS A MEASUREMENT AGAIN.
  #
  # WHAT HAPPENED. Run 35813212086: EVERY STEP SUCCEEDED and the job was killed
  # 15m07s into a `timeout-minutes: 15` cap, with the last falsifier ~23s from
  # finishing. It was cancelled three times on `main` the same day (35802822473,
  # 35792354993, 35783706860) and succeeded twice at 12m01s and 13m22s — so the
  # cap had been cutting off legitimate runs for hours, intermittently.
  #
  # ⚠️ A CANCELLED JOB IS NEITHER A PASS NOR A FAILURE, which is the whole
  # problem: the working agreement says never merge on one, so a cap firing on a
  # healthy job makes "wait for CI" a coin flip — and the cheap way out of a coin
  # flip is to stop reading the result.
  #
  # ⚠️⚠️ RAISING IT TO 25 WAS A STOPGAP AND THIS FILE SAID SO. The real fix is the
  # split: the thirteen `app/src/api/**` contract checks and their harnesses now
  # live in `api-contracts` below, which runs in PARALLEL with this job.
  #
  # ⚠️ MEASURED ON RUN 36050875005, WHICH IS WHY THE NUMBER BELOW IS 15 AGAIN:
  # the whole job was 941s (15m41s). Setup 171s, the seed and schema block 322s,
  # node and the two-connection suite 28s, `Stop` 23s — and the contract block
  # that moved out was 397s (6m37s) of it. What is left here is ~544s (9m04s),
  # so 15 minutes is about 1.65x headroom where the cancelled runs had 1.0x.
  #
  # ⚠️⚠️ AND THE SPLIT DOES NOT COST WALL-CLOCK, IT SAVES IT. The plan row argued
  # the move was free because jobs run in parallel. It is better than free: the
  # two halves are near-equal (~9m04s and ~9m50s), so `db` finishes in about ten
  # minutes instead of nearly sixteen.
  reset:
    name: supabase db reset
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # THE STARTER CATALOG (docs/PLAN.md 9b), FIRST BECAUSE IT NEEDS NO DATABASE.
      # The generator's own suite, then `--check`: the newest catalog migration
      # must be exactly what supabase/catalog/*.csv generate today. A CSV edited
      # without regenerating would otherwise merge green and never reach a shop.
      # Whether the generated SQL APPLIES is the reset below, like any migration.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Starter catalog — the generator's suite, and the CSVs agree with the newest snapshot
        run: |
          node --test supabase/catalog/build.test.mjs
          node supabase/catalog/build.mjs --check

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned to the version 0001 was first verified against, so a CLI
          # release cannot turn a green schema red without a commit saying why.
          version: 2.114.0

      - name: Start local Postgres
        run: supabase start

      - name: Apply migrations from scratch
        run: supabase db reset

      # `db reset` exits non-zero if any migration fails to apply, so reaching this
      # step means the schema is real. Print it so a reviewer can read what landed.
      - name: Show applied schema
        run: supabase migration list --local

      # ---------------------------------------------------------------------
      # pgTAP SUITES (ADR-035 §2.10, plan tasks 3.1 and 3.2a)
      #
      # THIS STEP MUST STAY BETWEEN THE RESET AND THE SEED CHECKS, and unlike the
      # step below it the reason is not the seed — it is `public` itself. Every
      # file in supabase/checks/ creates `public._verify` and leaves it standing
      # on purpose so its results survive to be read, and _cleanup.sql truncates
      # rather than drops. Run the structural suite after either of them and it
      # sees three to five scaffolding tables with no RLS and no policies, and
      # reports failures that are not defects. Here it sees exactly what
      # `supabase db reset` produced, which is the thing the suite is about.
      #
      # The suite asserts that position rather than trusting it (test F2), so
      # moving this step down the file turns the job red instead of quiet.
      #
      # pgTAP IS NOT A MIGRATION. It is ~1000 functions and two views, and
      # migrations are append-only — shipping it as 0015 would put a test
      # framework in every production database with no way back. _setup.sql
      # installs it into its own schema `tap` for the length of this step and
      # _teardown.sql drops it, so the database the next step reads is the one
      # the reset built.
      #
      # A pgTAP file under plain psql prints "not ok" to stdout and EXITS 0 — a
      # failing suite that looks identical to a passing one from a workflow's
      # point of view. Each suite therefore ends with
      # `finish(exception_on_failure := true)`, which raises, so ON_ERROR_STOP
      # makes psql exit non-zero. Seven deliberate falsifications were confirmed
      # to fail this step before it was committed (docs/PLAN.md task 3.1), and
      # eight more before 02 was (task 3.2a).
      #
      # 02 WRITES A FIXTURE AND ROLLS IT BACK. `workspace_invite` is the one
      # tenant table the seed leaves empty in both workspaces, and an isolation
      # claim over zero rows is a claim about nothing. The file is one
      # transaction, so the database the steps below read is still the one the
      # reset built — which is also why this step stays above them.
      #
      # FILES BEGINNING WITH `_` ARE HARNESS, NOT SUITES — the same convention
      # supabase/tests/ already uses. The counter is the same concern as the one
      # below: a loop that matched nothing would print nothing and exit 0, which
      # is what a deleted suite directory looks like.
      #
      # ⚠️ AND THE THIRD WAY A FAILING SUITE EXITS 0, found in task 3.3 and the
      # reason each suite's output is now scanned rather than only its exit
      # code. `finish(exception_on_failure := true)` is what every file here
      # relies on to turn a red assertion into a non-zero exit, and pgTAP
      # DISARMS it when the plan does not match the number of tests run:
      #
      #     IF curr_test <> exp_tests THEN
      #         RETURN NEXT diag('Looks like you planned … but ran …');
      #     ELSIF num_faild > 0 THEN
      #         IF raise_ex THEN RAISE EXCEPTION …
      #
      # An ELSIF. A miscounted plan takes the first branch and the exception in
      # the second is never reached — so `not ok` lines print, psql exits 0, and
      # this step goes green. Every suite here computes its plan from what it
      # measured, so every suite can land in that branch. Reproduced in four
      # lines: plan(3), one passing test, one failing test, finish(true) → exit
      # 0; change the plan to 2 and the identical file raises.
      #
      # The grep below is the backstop for ALL FIVE suites, including the four
      # that merged before this was known. 05 carries a per-file guard as well,
      # so it also defends itself when run by hand outside CI.
      - name: pgTAP suites (ADR-035 §2.10)
        run: |
          eval "$(supabase status -o env | grep '^DB_URL=')"
          export DB_URL
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/pgtap/_setup.sql
          ran=0
          out="$(mktemp -d)"
          for f in $(ls supabase/pgtap/*.sql | sort); do
            case "$(basename "$f")" in _*) continue ;; esac
            echo "::group::$f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f" 2>&1 | tee "$out/$(basename "$f").log"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "$f failed (psql exit $rc)" >&2
              exit 1
            fi
            # The disarmed-exception check. A suite whose plan disagrees with
            # what it ran has NOT proved anything, whatever its exit code said.
            if grep -q 'Looks like you planned' "$out/$(basename "$f").log"; then
              echo "$f: plan/actual mismatch — pgTAP suppressed the failure exception" >&2
              grep 'Looks like you planned' "$out/$(basename "$f").log" >&2
              exit 1
            fi
            # Belt and braces: a `not ok` that reached this point reached it
            # because the exception did not fire.
            if grep -qE '^ *not ok [0-9]' "$out/$(basename "$f").log"; then
              echo "$f: failing assertions present despite a zero exit" >&2
              grep -E '^ *not ok [0-9]' "$out/$(basename "$f").log" >&2
              exit 1
            fi
            ran=$((ran + 1))
          done
          if [ "$ran" -eq 0 ]; then
            echo "no suites in supabase/pgtap/ — nothing was asserted" >&2
            exit 1
          fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/pgtap/_teardown.sql
          echo "$ran pgTAP suite(s) ran"

      # ---------------------------------------------------------------------
      # EVERY CHECK IN supabase/checks/, OVER SEED DATA (plan tasks 1.7 and 2.1)
      #
      # This step was the §2.4 invariant alone until 2.1 added the margin view's
      # reconciliation beside it. Both belong here for the same reason and neither
      # could live in supabase/tests/, so the step runs the directory rather than a
      # file, in name order.
      #
      # THIS STEP MUST STAY BETWEEN THE RESET AND THE SUITE LOOP, and the order is
      # the whole reason it is a step of its own rather than a file in
      # supabase/tests/. `_cleanup.sql` runs before every suite and truncates
      # every table but `unit`, so by the time the first suite starts the seed is
      # gone — and an invariant check over an empty database PASSES. That vacuous
      # green is the failure ADR-035 §9 exists to refuse, so the checks below
      # refuse to run at all until they can see a populated ledger.
      #
      # The reset above already ran the seed's own assertions, which raise and
      # exit non-zero. This is not those. Those ask whether each seed file wrote
      # what it meant to; this asks whether the projection agrees with the ledger
      # across all four of them at once, whether the projection can be thrown away
      # and rebuilt from stock_movement alone at seed scale, and whether
      # rebuild_batch_balance(workspace) respects its argument — which is a claim
      # no single-tenant fixture can make.
      #
      # It ends by corrupting the projection on purpose and confirming the check
      # catches it, so a green here is never a green from a check that cannot go
      # red.
      #
      # The file counter is the same concern as reading the suite counts by name:
      # a loop that matched nothing would print nothing and exit 0, which is what
      # a deleted check directory looks like.
      - name: Checks over the seed (ADR-035 §2.4, §2.9)
        run: |
          eval "$(supabase status -o env | grep '^DB_URL=')"
          export DB_URL
          ran=0
          for f in $(ls supabase/checks/*.sql | sort); do
            echo "::group::$f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          if [ "$ran" -eq 0 ]; then
            echo "no files in supabase/checks/ — nothing was checked over the seed" >&2
            exit 1
          fi
          echo "$ran seed check file(s) ran"

      # Every suite in supabase/tests/, in name order, against the database the
      # reset just built. Each one assumes a database holding nothing but its own
      # fixture — they share hardcoded user uuids and assert absolute counts — and
      # none of them can clean up after itself, because the ledger is append-only.
      #
      # SO EACH IS PRECEDED BY supabase/tests/_cleanup.sql, not by another
      # `supabase db reset`. The reset above still runs, once, and it is what
      # proves the migrations apply from scratch (ADR-035 §9); repeating it per
      # file bought nothing beyond an empty database and cost 20.5s a time against
      # the cleanup's 0.56s. The cleanup sweeps pg_tables dynamically and then
      # asserts it emptied what it claims, so an incomplete one fails loudly
      # instead of leaving the next suite counting someone else's rows.
      #
      # FILES BEGINNING WITH `_` ARE HARNESS, NOT SUITES, and are skipped here.
      #
      # ⚠️ THIS DIRECTORY IS ALL .sql AGAIN, AS OF PLAN TASK 3.7b. It held one .sh
      # — 0005_allocation_concurrency.sh, two real connections proving that two
      # concurrent allocations cannot oversell one batch (docs/PLAN.md task 1.3b) —
      # because that claim cannot be made from a single psql session. It is now
      # supabase/vitest/test/allocation-race.test.ts, in the step at the bottom of
      # this file, and the reasoning for moving rather than keeping it is recorded
      # under 3.7b. A .sh here would now fail loudly on the `unrecognised` branch
      # below rather than run, which is the right outcome: the two-connection home
      # in this repository is the Vitest workspace, not this loop.
      #
      # THE COUNTER IS THE SAME CONCERN AS THE OTHER TWO LOOPS. A glob that matched
      # nothing would print nothing and exit 0 — which is what this directory looks
      # like after a bad rebase, and it is one file emptier than it was.
      - name: Behavioural checks
        run: |
          eval "$(supabase status -o env | grep '^DB_URL=')"
          export DB_URL
          ran=0
          for f in $(ls supabase/tests/* | sort); do
            case "$(basename "$f")" in _*) continue ;; esac
            echo "::group::$f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/tests/_cleanup.sql
            case "$f" in
              *.sql) psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f" ;;
              *)     echo "unrecognised test file: $f" >&2; exit 1 ;;
            esac
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          if [ "$ran" -eq 0 ]; then
            echo "no suites in supabase/tests/ — nothing was asserted" >&2
            exit 1
          fi
          echo "$ran behavioural suite(s) ran"


      # ---------------------------------------------------------------------
      # THE TWO-CONNECTION SUITES — TypeScript (tasks 3.7a, 3.7b and 4c-ii)
      #
      # THREE CLAIMS, AND TWO OF THEM ARE §2.10's. idempotency.test.ts is that
      # row's second clause ("two identical calls, same id → exactly one row",
      # task 3.7a); availability-race.test.ts is its FIRST ("two sessions, last
      # unit, enforcement on → exactly one succeeds", task 4c-ii), which could
      # not be written until 0017 applied because there was no enforcement path
      # to switch on. §2.10's concurrency row is CLOSED as of that suite.
      # allocation-race.test.ts is docs/PLAN.md task 1.3b's claim about
      # allocate_fefo() — "two concurrent allocations cannot oversell one batch"
      # — which §2.10 never asked for and which ran as a .sh in supabase/tests/
      # until 3.7b ported it here. The last two assert OPPOSITE outcomes on
      # purpose: §2.10's enforcement clause refuses the loser, the allocator
      # makes it re-read and take the next lot. See docs/PLAN.md task 3.7b.
      #
      # THIS STEP MUST STAY LAST, below every psql step above it, and the reason
      # is the same one that fixes the order of all the others. The suite runs
      # supabase/tests/_cleanup.sql itself — the same file, not a copy — so by
      # the time it has built its fixture the seed is gone. Run it higher up and
      # the seed checks and pgTAP suites 02–07 would be measuring an empty
      # database.
      #
      # They would go RED, not quiet: every file in supabase/checks/ has a
      # pre-flight block that refuses to run unless the seed still holds what it
      # is about, and 02–07 assert absolute counts. That is deliberate on their
      # part and it is what makes this step's position safe to state rather than
      # merely hope for. It is still stated.
      #
      # WHY NODE IS HERE AND NOT IN money.yml. money.yml boots no database, which
      # is the whole reason it is a separate workflow — and §2.10's concurrency
      # row cannot be asserted without one. A single session cannot block on its
      # own lock, so this suite needs two real connections against the Postgres
      # the reset above built. It is the first thing in this workflow that
      # reaches the database through something other than psql, and that is the
      # point: node-postgres speaks the wire protocol, so the suite runs on a
      # machine with no Postgres client installed. The schema owner's machine is
      # such a machine (docs/PLAN.md, task 3.1), which is why the .sh this step
      # absorbed in 3.7b had never once been run outside CI — the argument that
      # decided 3.7b.
      #
      # ⚠️ THE COUNTER, AND WHY IT IS NOT OPTIONAL. 3.3 found that a suite can
      # print failures and exit 0; 3.6a found that a green tick is also what a
      # step that ran NOTHING looks like. Vitest exits non-zero on "No test files
      # found" — falsified by hand as V6 — but a suite that quietly SHRANK still
      # exits 0. The count is read from the JSON reporter, not scraped from the
      # terminal: money.yml's first spelling grepped the summary line and failed
      # its own first run on a green suite, because Vitest wraps that line in
      # ANSI colour codes.
      #
      # ⚠️ V6 IS WEAKER SINCE 3.7b, AND THE GAP IS THE SHRINK ONE ABOVE. With two
      # files here, deleting ONE no longer trips "No test files found" — the step
      # goes green on the other. The number in the log is what a reviewer reads
      # (29 as of 4c-ii, was 16); it is deliberately not pinned here, the same
      # call money.yml makes and for the same reason. Recorded in docs/PLAN.md.
      #
      # ⚠️⚠️ AND `if (!r.success)` IS THE ONLY GUARD BELOW THAT CATCHES A SUITE
      # WHICH DIED IN `beforeAll`, measured in 4c-ii. availability-race.test.ts
      # runs its three races there, so a schema defect that makes the FIRST
      # session's own call raise kills the file before one assertion executes.
      # The JSON reporter then says success:false, numTotalTests:29 and
      # numFailedTests:0 — the count guard and the failure guard BOTH pass, and
      # a green step would have asserted nothing about §2.10's concurrency row.
      # Observed under falsification W-F3. Do not simplify that first line away.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install (npm workspaces)
        run: npm ci

      - name: Vitest — two connections (ADR-035 §2.10, and task 1.3b's allocator race)
        run: |
          set -o pipefail
          eval "$(supabase status -o env | grep '^DB_URL=')"
          export DB_URL
          npm run test:db --workspace @tienda/db-concurrency -- \
            --reporter=default --reporter=json --outputFile="$PWD/vitest-db-report.json"
          node -e '
            const r = require("./vitest-db-report.json");
            if (!r.success) { console.error("suite reported failure"); process.exit(1); }
            if (!r.numTotalTests || r.numTotalTests < 1) {
              console.error("no tests ran — a green here would assert nothing");
              process.exit(1);
            }
            if (r.numFailedTests > 0) {
              console.error(`${r.numFailedTests} failing assertions`);
              process.exit(1);
            }
            console.log(`${r.numPassedTests} two-connection assertions ran against the reset database`);
          '

      - name: Stop
        if: always()
        run: supabase stop --no-backup

  # ⚠️⚠️ THE APP'S DATA LAYER AGAINST A REAL DATABASE — SPLIT OUT OF `reset` BY
  # `5R-g` ON 2026-09-24, AND THE SPLIT IS THE FIX FOR A CAP THAT KEPT RISING.
  #
  # WHY IT IS ITS OWN JOB. `reset` was doing ~5m of seed and schema checks and
  # then running THIRTEEN contract checks with their harnesses back to back, all
  # on one clock — 941s against a 15-minute cap, which cancelled healthy runs on
  # `main` for hours on 2026-09-22. ⚠️ A cancelled job is neither a pass nor a
  # failure, and the working agreement says never merge on one. Raising the cap
  # was a stopgap that would have needed raising again every few tasks, because
  # every new `app/src/api/**` claim lands in this block.
  #
  # ⚠️ JOBS RUN IN PARALLEL, so moving 397s of work here costs no wall-clock at
  # all — measured on run 36050875005 — and takes the seed checks off the same
  # clock as the app's contracts. Both halves now sit near 9-10 minutes.
  #
  # ⚠️⚠️ IT NEEDS NO NODE AND NO `npm ci`, WHICH WAS MEASURED RATHER THAN
  # ASSUMED. Every check here is bash driving live HTTP; the only two scripts
  # that mention `node` do so in a COMMENT explaining why they cannot use it
  # (`@/lib/outboxDb` imports a native module). `setup-node` and `npm ci` stayed
  # behind in `reset`, where the two-connection Vitest suite genuinely needs
  # them — so this job is leaner than a copy of that one would have been.
  #
  # ⚠️ THE EXCLUSION LIST IS `catalog-write`'s, for its reason: these checks sign
  # people up through GoTrue and post rows through PostgREST, both via Kong, and
  # bringing up the rest is a minute of start-up for containers nothing here
  # touches. ⚠️ `db reset` is what puts the schema AND the seed in front of them.
  api-contracts:
    name: the app's data layer against a real database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned for `reset`'s reason: a CLI release must not turn a green
          # schema red without a commit saying why.
          version: 2.114.0

      - name: Start Postgres, GoTrue and PostgREST
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Apply migrations from scratch
        run: supabase db reset

      # ⚠️⚠️ THE APP'S DATA LAYER, ASKED OF THE DATABASE ITSELF (plan task 5b-i).
      #
      # `app.yml` typechecks `app/src/api/` and runs a Vitest suite over it, and
      # NEITHER CAN SEE THE ONE DEFECT THAT MATTERS: TypeScript has never read
      # `0027`, so an argument renamed on either side of the wire is a 404 with
      # code `PGRST202` — "Could not find the function
      # public.onboard_workspace(display_name) in the schema cache" — that
      # compiles, bundles, passes 166 assertions and is first noticed by a
      # shopkeeper who cannot create her shop.
      #
      # It runs HERE rather than in app.yml because the evidence it needs is a
      # reset database with PostgREST and GoTrue in front of it, and that is
      # what this workflow already has standing. It reads the app's own strings
      # out of `app/src/api/workspace.ts` rather than carrying a second copy.
      - name: Contract — does app/src/api/ still describe the schema (plan 5b-i)
        run: bash docs/checks/5b-i-api-contract.sh

      # And its own six fixtures, for the reason app.yml states about the plan
      # guards: a check nobody has seen fail is a check nobody has shown can.
      # ⚠️ ITS FIRST RUN FOUND A DEFECT IN THE CHECK ABOVE — the argument reader
      # recognised an argument by the `p_` prefix it exists to test, so dropping
      # the prefix made it report "could not read the contract" instead of the
      # 404. Red for the wrong reason, which is the failure this harness is
      # written to match on rather than trusting an exit code.
      - name: Contract — can that check still fail (its own six fixtures)
        run: bash docs/checks/5b-i-api-contract-falsify.sh

      # ⚠️⚠️ AJUSTES' ROSTER, ASKED OF THE DATABASE AND OF ITS POLICIES (plan
      # task 5b-ii-a). Three real people in three real roles: the founding owner,
      # a manager who redeemed an invite, and a staff member who redeemed
      # another. It asserts the two column lists against the real tables, that
      # the client-side join has something to join on, that the founding owner
      # has no invite row (`T2`), that `token_hash` never reaches the app — and,
      # the assertion no other check in this repository can make, that a STAFF
      # caller still reads the roster and zero invites. That asymmetry is what
      # the owner's ruling of 2026-09-18 was ruled ON.
      - name: Contract — does Ajustes' roster still describe the schema (plan 5b-ii-a)
        run: bash docs/checks/5b-ii-a-roster-contract.sh

      # And its own eleven fixtures. ⚠️ TWO OF THEM MOVE AN APPLIED POLICY IN
      # PLACE, run the check, and put it back — because those two assertions
      # cannot be falsified by editing a TypeScript file, and a fixture nobody
      # can write is an assertion nobody has shown can fail. Each restore is
      # trapped on every exit path and then asserted by a second green run.
      # ⚠️ `G5` LOOSENS the invite policy: the roster's manager fence exists
      # because staff cannot read `workspace_invite`. ⚠️⚠️ `G8` NARROWS
      # `workspace_member_select` — the fence the owner DECLINED on 2026-09-18
      # when he ruled "leave it" on a cashier reading her colleagues' names, and
      # the fixture that keeps `5b.8-ii`'s retirement of two split-guard
      # sentinels honest: that retirement rests on assertion 9, so assertion 9
      # has to be able to fail. A narrowed policy left behind makes the whole
      # tree look broken rather than safe, which is why its restore is asserted
      # in its own right.
      # ⚠️ Its first run found a real defect in the check above: a PostgREST 400
      # body quotes the column it thinks you meant, and pasting that into a
      # Python literal made the check say "unreadable" where it owed the column's
      # name. Red for the wrong reason — the same shape 5b-i's harness found in
      # its sister on ITS first run.
      - name: Contract — can the roster check still fail (its own eleven fixtures)
        run: bash docs/checks/5b-ii-a-roster-contract-falsify.sh

      # ⚠️⚠️ THE NAME A PERSON TYPES AT SIGN-UP (plan task 5b.7). The plan row
      # says it in one sentence: *"a round trip is the evidence, not the file."*
      # Everything up to the last hop is ours and `app/test/credentials.test.ts`
      # covers it; that GoTrue writes `options.data` into `raw_user_meta_data`
      # and keeps it is a claim about somebody else's system, and ADR-035 §9
      # says a green CI run is what settles those. It signs a person up with
      # accents and two surnames, signs them back IN on a second request that
      # never saw the first one's body, and reads the same string back.
      - name: Contract — does the name survive signUp (plan 5b.7)
        run: bash docs/checks/5b.7-signup-name-contract.sh

      # And its own seven fixtures. ⚠️ ONE OF THEM SILENCES THE PROBE rather
      # than editing the app, for the reason the roster harness gives about the
      # policy it loosens: no line in `app/` can make GoTrue lose what it was
      # given, so that is the only way to show the two assertions which read the
      # wire can go red at all. ⚠️ Its first run caught this check reporting
      # `bad_json` where it owed "the field was absent" — red for the wrong
      # reason, the third time that shape has appeared in a contract check here.
      - name: Contract — can the sign-up name check still fail (its own seven fixtures)
        run: bash docs/checks/5b.7-signup-name-contract-falsify.sh

      # ⚠️⚠️ THE INVITE PATH (plan task 5b-ii-b-1). Nine assertion groups over one
      # reset database with three real people and two stores. The two that
      # nothing else in this repository can make: the minted token is nowhere in
      # `workspace_invite` — only the hash is stored — and a STAFF caller is
      # refused `42501` by the fence in `create_invite`'s BODY, which is where it
      # has to be because §2.7's "under normal RLS" cannot supersede a row
      # (`5b.8` owes that amendment, ruled 2026-09-18).
      - name: Contract — does create_invite answer to what the app sends (plan 5b-ii-b-1)
        run: bash docs/checks/5b-ii-b-1-invite-contract.sh

      # And its own nine fixtures, in about fifteen seconds. ⚠️ TWO OF THEM
      # MUTATE THE PROBE rather than the app, for the reason the sign-up harness
      # above gives: no line in `app/` can make Postgres store a plaintext token
      # or drop its own fence, and a fixture nobody can write is an assertion
      # nobody has shown can fail. ⚠️ Its own fixtures caught TWO defects in the
      # check while it was being written — an assertion that could not fail, and
      # one that was red for the wrong reason.
      #
      # ⚠️⚠️ AND THIS STEP WAS CANCELLED ON ITS FIRST CI RUN, at the 15-minute job
      # cap, because the harness reset the database once per fixture on a comment
      # that claimed the reset was required and had never been tested. It is not:
      # every run mints a fresh workspace and fresh addresses, so nothing can
      # collide. A CANCELLED step is neither a pass nor a failure, which makes it
      # the worst of the three to merge on.
      - name: Contract — can the invite check still fail (its own nine fixtures)
        run: bash docs/checks/5b-ii-b-1-invite-contract-falsify.sh

      # ⚠️⚠️ THE REDEMPTION (plan task 5b-ii-b-2), AND IT CLOSES THE LOOP THE
      # STEP ABOVE OPENS: an owner mints a token there, a second person spends it
      # here, and there are two people in the shop. Nine assertion groups over one
      # reset database with three real people, one shop and two stores.
      #
      # ⚠️ The one nothing else in this repository can make: THAT SIXTEEN AND
      # EIGHT ARE STILL THE TWO LENGTHS. `@/api/redeem` chooses which RPC to call
      # by measuring what a person typed, because the two credentials are
      # indistinguishable otherwise — so if either length moved, every Vitest
      # assertion would stay green while this app sent a joiner down the wrong
      # path. §2.11 refuses the rendering suite that would notice.
      - name: Contract — does redeem_invite answer to what the app sends (plan 5b-ii-b-2)
        run: bash docs/checks/5b-ii-b-2-redeem-contract.sh

      # And its own nine fixtures, in about seventeen seconds. ⚠️ TWO OF THEM
      # MUTATE THE PROBE rather than the app, for the reason the two harnesses
      # above give: no line in `app/` can make Postgres admit a stranger or stop
      # being idempotent, and a fixture nobody can write is an assertion nobody
      # has shown can fail. ⚠️ AND NONE OF THEM RESETS THE DATABASE — the sibling
      # harness was CANCELLED at the 15-minute job cap for doing that, on a
      # comment claiming the reset was required that had never been tested.
      - name: Contract — can the redemption check still fail (its own nine fixtures)
        run: bash docs/checks/5b-ii-b-2-redeem-contract-falsify.sh

      # ⚠️⚠️ FIXING YOUR OWN NAME (plan task 5b.8-iii-b). Eight assertion groups
      # over one reset database with three real people in one shop.
      #
      # ⚠️ The one nothing else in this repository can make: A STAFF CALLER
      # RENAMES HERSELF AND IT IS ACCEPTED. `workspace_member_update`
      # (`0001:532`) is `has_role(workspace_id,'owner')`, so before `0035` a
      # cashier could not touch the row that describes her — and she is the
      # likeliest person to have arrived from Google as ONE WORD. §2.11 refuses
      # the rendering suite that would notice the section missing, and no Vitest
      # assertion can see a policy: a `security definer` function narrowed by a
      # later migration would leave all 363 of them green.
      - name: Contract — can a person fix her own name (plan 5b.8-iii-b)
        run: bash docs/checks/5b.8-iii-b-name-contract.sh

      # And its own ten fixtures, in about seventeen seconds. ⚠️ THREE OF THEM
      # MUTATE THE PROBE rather than the app, for the reason the three harnesses
      # above give: no line in `app/` can make Postgres stop trimming a name,
      # stop refusing a blank one, or start refusing a cashier. ⚠️ Its own
      # fixtures caught a defect in the check while it was being written — a
      # request body inlined inside three levels of command substitution, which
      # PostgREST answered `PGRST102 — Empty or invalid json` and the assertion
      # reported as "could not seat a staff member". RED FOR THE WRONG REASON,
      # the fourth time that shape has appeared in a contract check here, and the
      # trap `5b.7`'s check had already written down.
      - name: Contract — can the name check still fail (its own ten fixtures)
        run: bash docs/checks/5b.8-iii-b-name-contract-falsify.sh

      # ⚠️⚠️ ASKING TO JOIN (plan task 5b-iii-b) — THE PULL PATH, and the other
      # half of the loop the two redemption steps above close. Eleven assertion
      # groups over one reset database with four real people and two shops.
      #
      # ⚠️ The two nothing else in this repository can make. FIRST, `S3`: the
      # check has a REAL non-member select `workspace_invite` directly and
      # asserts she gets zero rows, which is what says `my_access_requests` is
      # the only door rather than a convenience. SECOND, THE `42501` OVERLOAD: it
      # drives an anonymous caller AND a nonsense code and compares the two
      # answers to each other as well as to the app's own constant — so the
      # screen-local reading in `@/api/requests` was a measured judgement rather
      # than somebody not having noticed. ⚠️⚠️ THAT ASSERTION HAS NOW TURNED
      # OVER, on 2026-09-22: `0038` (task `5b.9`) minted `TD006` for the code that
      # resolves to no shop, the marker constant in `@/api/requests` is deleted,
      # and assertion 9 asserts the OPPOSITE — that the two come back DIFFERENT.
      # A marker and the assertion that drives it retire together, and this step
      # is what says a later migration cannot quietly put them back.
      - name: Contract — does request_access answer to what the app sends (plan 5b-iii-b)
        run: bash docs/checks/5b-iii-b-request-contract.sh

      # And its own eleven fixtures. ⚠️ FOUR OF THEM MUTATE THE PROBE rather than
      # the app, for the reason the three harnesses above give: no line in `app/`
      # can make Postgres show a non-member her own invite row, stop ordering by
      # `created_at`, re-merge two SQLSTATEs, or change what PostgREST refuses an
      # anonymous caller with. ⚠️ `V10` is the newest and it is the rule this
      # directory keeps re-learning: assertion 9 gained a branch when `0038`
      # inverted it, so the harness gained a fixture in the same pass — a branch
      # nobody has shown can fire is a branch nobody has tested. ⚠️ AND NONE OF THEM RESETS THE DATABASE
      # — the sibling harness was CANCELLED at the 15-minute job cap for doing
      # that. ⚠️ Its own fixtures caught a weakness in the check while it was
      # being written: assertion 2's expected `PGRST202` has TWO causes, and a
      # renamed RPC makes it green on a broken app. Assertion 4 covers it and
      # `V1`'s comment says so, rather than the fixture being quietly reworded.
      - name: Contract — can the request check still fail (its own eleven fixtures)
        run: bash docs/checks/5b-iii-b-request-contract-falsify.sh

      # ⚠️⚠️ THE APPROVER'S HALF OF THE PULL PATH (plan task `5b-iii-d-1`), AND IT
      # ASSERTS THREE THINGS NOTHING ELSE HERE CAN. FIRST, THE COLUMN LIST, both
      # ways: the six fields `PendingRequestRow` names must be exactly what `0037`
      # returns, because a column read that is not there renders blank rather than
      # failing. SECOND, THE FENCE AS A PAIR: an owner's two rows against a
      # manager's, a cashier's, a stranger's and the REQUESTER'S OWN zero, over one
      # workspace holding the same two requests — `0037` answers a non-owner with
      # an empty list rather than refusing, so a row count alone cannot tell the
      # fence from a quiet day. THIRD, THAT THE NAME HAS NO SECOND DOOR: the owner
      # is made to try the invite row itself and `auth_full_name` directly, and
      # both must stay shut. If either opens, `0037` has become a convenience
      # rather than the only route.
      - name: Contract — does pending_access_requests answer what the app sends (plan 5b-iii-d-1)
        run: bash docs/checks/5b-iii-d-1-approvals-contract.sh

      # And its own thirteen fixtures. ⚠️ FIVE MUTATE THE PROBE rather than the
      # app, for the reason every harness above gives: no line in `app/` can make
      # Postgres show a manager somebody else's queue, unfence `auth_full_name`,
      # put a name on the invite row, count a push invite as a person waiting, or
      # reverse a `select` order. ⚠️ `V4` IS THE ONE TO READ — it adds a column to
      # the app's row type, which is the direction a real edit goes and the defect
      # the typecheck, the suite and the bundler all pass straight over.
      # ⚠️ AND NONE OF THEM RESETS THE DATABASE — a sibling harness was CANCELLED
      # at the job cap for doing that, which is neither a pass nor a failure.
      - name: Contract — can the approvals check still fail (its own thirteen fixtures)
        run: bash docs/checks/5b-iii-d-1-approvals-contract-falsify.sh

      # ⚠️⚠️ THE ACT (plan task `5b-iii-d-2`), AND `D8` IS WHY THIS STEP MATTERS
      # MORE THAN ITS SIBLINGS. §2.11 keeps rendering out of scope, so no suite
      # in this repository can see a location picker quietly defaulting to
      # empty — and the person who pays for that is the approved staff member,
      # who is let into the shop and then silently refused every write she
      # makes. This step drives the SERVER half of that fence (`0029:407`
      # refuses an empty array for a staff row), asserts the refusal wrote
      # nothing, and then SIGNS IN AS HER to prove the store she was given is
      # the only one she can read.
      # ⚠️ IT ALSO CLOSES THE GAP `5b-iii-d-1`'s check names in its own header —
      # that an approved request LEAVES the queue — which was unassertable until
      # this module existed.
      # ⚠️ AND IT MEASURES THE OWNER FENCE AS A PAIR: a manager, a cashier, a
      # stranger, another shop's owner and the requester herself are each
      # refused the SAME live request the owner then approves. A `42501` from a
      # function that is simply broken is also a `42501`.
      - name: Contract — does approve_request answer what the app sends (plan 5b-iii-d-2)
        run: bash docs/checks/5b-iii-d-2-approve-contract.sh

      # And its own seventeen fixtures. ⚠️ EIGHT MUTATE THE PROBE rather than the
      # app, for the reason every harness above gives. ⚠️ `W9` AND `W11` ARE THE
      # TWO TO READ: the first sends a store where the check means to send NONE,
      # so assertion 3 must be measuring the empty array specifically; the second
      # reads the staff member's view as the OWNER, who sees both stores, so
      # assertion 4 cannot be green for the wrong person.
      # ⚠️ AND NONE OF THEM RESETS THE DATABASE — a sibling harness was CANCELLED
      # at the job cap for doing that, which is neither a pass nor a failure.
      - name: Contract — can the approve check still fail (its own seventeen fixtures)
        run: bash docs/checks/5b-iii-d-2-approve-contract-falsify.sh

      # ⚠️⚠️ THE FLUSH (plan task `5c-ii-a`), AND ITS SUBJECT IS A CONTRACT NO
      # OTHER MODULE IN THIS APP HAS. Every other `src/api/` module writes its
      # `p_` argument names out as literals; `@/api/flush` BUILDS them, as `p_`
      # plus the payload's own keys — because `0024` decision 5 stores
      # `failed_write.payload` as the original call's arguments keyed by argument
      # name, and `replay_failed_write` reads that object directly. So the prefix
      # rule IS the contract, and nothing in the typecheck or the Vitest suite
      # has ever read a migration.
      #
      # ⚠️ THE TWO ASSERTIONS NOTHING ELSE HERE CAN MAKE: one uuid sent twice is
      # ONE sale carrying `already_recorded` — the whole of "retries are free",
      # measured on the path the flush actually uses — and an OFFLINE write with
      # a null `occurred_at` is silently stamped with `now()`, which is the harm
      # `occurredAt`'s `queuedAt` fallback exists to prevent and the reason that
      # fallback is not a default.
      - name: Contract — does record_sale answer what a flush sends (plan 5c-ii-a)
        run: bash docs/checks/5c-ii-a-flush-contract.sh

      # And its own nine fixtures. ⚠️ EVERY ONE OF THEM DRIFTS A NAME IN
      # `@/api/flush` AND DEMANDS THE CHECK MEET THE 404 A SHOP WOULD — not
      # merely fail to find the old spelling, which is a check agreeing with
      # itself. Its first run found exactly that defect in two of the check's
      # readers, the same shape `5b-i`'s harness found in its sister on ITS first
      # run: red for the wrong reason.
      - name: Contract — can the flush check still fail (its own nine fixtures)
        run: bash docs/checks/5c-ii-a-flush-contract-falsify.sh

      # ⚠️⚠️ THE DEAD LETTER (plan task `5c-iii`), AND IT IS THE ONLY CHECK IN
      # THIS WORKFLOW WHOSE SUBJECT CAN CHANGE THE LEDGER WITHOUT ANYBODY
      # NOTICING. `record_failed_write` downgrades the shelf so the balance
      # matches what is physically there, and a downgrade carries no revenue, no
      # tax split and no batch attribution — §2.6: "stock stays true; margin goes
      # quiet". §2.8 sends the row to the VENDOR, and C10.5 keeps it off the
      # shopkeeper's screen entirely. So there is no person in the loop who would
      # ever see a misclassification, and this is the whole instrument.
      #
      # ⚠️ THE TWO ASSERTIONS NOTHING ELSE IN THIS REPOSITORY CAN MAKE: that an
      # unusable session answers `PGRST301` and NOT the `42501` the app
      # dead-letters — without which one stale token downgrades a whole queue —
      # and that `TD002` ("not enough stock") is cleared by the very next retry,
      # because `0017` skips enforcement when `recorded_offline` is true and the
      # flush's second attempt always sets it. Both are facts about the applied
      # schema that no typecheck and no Vitest suite has ever read.
      - name: Contract — is what the app dead-letters what the schema raises (plan 5c-iii)
        run: bash docs/checks/5c-iii-dead-letter-contract.sh

      # And its own eleven fixtures. ⚠️ SIX DRIFT A NAME AND MEET A 404; FIVE
      # DRIFT A JUDGEMENT — a code moved from one side of the classification to
      # the other — and those are the ones nothing but a database can see, because
      # a misfiled code is a green build, a green suite and a quietly wrong ledger.
      - name: Contract — can the dead-letter check still fail (its own eleven fixtures)
        run: bash docs/checks/5c-iii-dead-letter-contract-falsify.sh

      # ⚠️⚠️ THE CATALOG, AND THE THREE THINGS ONLY A DATABASE CAN SAY ABOUT IT.
      # `app/test/api-catalog.test.ts` proves the app agrees with itself over
      # fifty-eight tests; not one of them has read `0002`. This one drives a real shop —
      # a family, three variants, an expired price, a future price and a
      # store-scoped one — through the exact `select=` the app sends.
      #
      # It is the only instrument for: the EMBED across `product_variant_family_fk`,
      # which is a COMPOSITE key and the reason the whole catalog is one request;
      # the `::text` casts, read as a JSON TYPE off the wire, without which every
      # price becomes a double and then a dash; the price WINDOW, which lives in
      # the query and nowhere else; and the fact that a CASHIER reads every
      # product and every shelf price, which is `5d`'s own decision on the
      # owner's behalf and dies silently the day a migration narrows a policy.
      - name: Contract — does app/src/api/catalog.ts still describe the schema (plan 5d-i)
        run: bash docs/checks/5d-i-catalog-contract.sh

      # And its own thirteen fixtures. ⚠️ EIGHT BREAK THE CONTRACT — a renamed
      # column, a dropped cast, an inner join, a star select, a widened window —
      # and TWO NARROW AN APPLIED POLICY, then put it back, because the
      # every-member read is a decision no client-side edit can falsify.
      - name: Contract — can the catalog check still fail (its own thirteen fixtures)
        run: bash docs/checks/5d-i-catalog-contract-falsify.sh

      # ⚠️⚠️ THE TAKINGS, AND THE FOUR THINGS ONLY A DATABASE CAN SAY ABOUT THEM.
      # `app/test/api-today.test.ts` proves the app agrees with itself over
      # thirty-three assertions; not one of them has read `0003`. This one drives
      # three real sales — one dated yesterday and recorded now, two this morning,
      # one of them then voided — through the exact `select=` and the exact `gte`
      # the app sends.
      #
      # It is the only instrument for: the `::text` casts, read as a JSON TYPE off
      # the wire, without which the app shows NO takings rather than wrong ones;
      # the DAY WINDOW, which lives in the query and nowhere else; the fact that a
      # void writes a SECOND negated row rather than deleting the first, which is
      # the premise of the count rule; and the fact that a CASHIER reads the day's
      # sales, which is the owner's ruling of 2026-09-14 and dies silently the day
      # a migration narrows a policy.
      - name: Contract — does app/src/api/today.ts still describe the schema (plan 5d-iv-a)
        run: bash docs/checks/5d-iv-a-takings-contract.sh

      # And its own eleven fixtures. ⚠️ SEVEN BREAK THE CONTRACT — a renamed
      # column, either dropped cast, a star select, the wrong window column, a
      # missing `reversal_of`, an unreadable contract — and TWO NARROW AN APPLIED
      # POLICY, then put it back, because a cashier's right to see the day's
      # takings is a decision no client-side edit can falsify.
      - name: Contract — can the takings check still fail (its own eleven fixtures)
        run: bash docs/checks/5d-iv-a-takings-contract-falsify.sh

      # ⚠️⚠️ NÚMEROS, AND IT IS APPENDED HERE RATHER THAN OPENED AS A NINTH JOB (`7a`,
      # 2026-09-28). The takings check above is its nearest neighbour — real sales, a
      # void that nets, a cashier's read — and this job's NAME already describes it,
      # so nothing is renamed ([[counts-belong-to-the-runner]]: the job count stays
      # eight in this file). Measured: this job ran 9m31s of its 15 on `main`'s last
      # run, and the two steps below take ~3s and ~10s locally.
      #
      # It is the only instrument for: the headline being GROSS (a taxed product keyed
      # at $180.00 must read back $180.00, not the net beside it); the view being a
      # SPINE that `line_count` filters down to sales (a product bought and never sold
      # must not come back); a same-day void netting to nothing; paging over a TOTAL
      # order reassembling the whole read below `max_rows`, which truncates silently;
      # a CASHIER reading the owner's rows — the owner's ruling of 2026-09-28, that
      # every role sees Números; and another shop reading none.
      - name: Contract — does app/src/api/sales.ts still describe the schema (plan 7a)
        run: bash docs/checks/7a-sales-contract.sh

      # And its four fixtures — each a copy of `sales.ts` with one constant broken and
      # the database untouched, so exactly one side of the comparison moves, and each
      # asserted red for its OWN reason rather than for any reason.
      - name: Contract — can the sales check still fail (its own four fixtures)
        run: bash docs/checks/7a-sales-contract-falsify.sh

      # ⚠️⚠️ THE MONTH DOWNLOAD, AND IT IS APPENDED HERE TOO (`7d`, 2026-09-28) —
      # Números is its screen and `7a` is its neighbour. Measured: this job ran
      # 10m08s of its 15 on `main` (run 36443364209); the check takes ~2.5s locally
      # and its falsifier runs it six times.
      #
      # It is the only instrument for: `transaction_export` (`0033`) answering the
      # app's named columns with every figure a STRING; the cost of a write-off
      # never reaching the phone; all three kinds in one month with the void flagged
      # and negated; the month filter choosing the month (its neighbours read `[]`);
      # paging reassembling below `max_rows`; and a CASHIER reading ZERO rows — the
      # fence the owner's ruling of 2026-09-28 (no download for her) rests on.
      - name: Contract — does app/src/api/monthExport.ts still describe the schema (plan 7d)
        run: bash docs/checks/7d-month-export-contract.sh

      # And its five fixtures, each red for its OWN reason.
      - name: Contract — can the month export check still fail (its own five fixtures)
        run: bash docs/checks/7d-month-export-contract-falsify.sh

      # ⚠️⚠️ PRECIOS, APPENDED HERE TOO (`7b`, 2026-09-28) — Números is its door and
      # `7a` reads one of its two views. Measured: this job ran 9m35s of its 15 on
      # `main` (run 36457025459); the check takes ~2.7s locally and its falsifier
      # ~17s, running it seven times.
      #
      # It is the only instrument for: `0032`'s price WITH IVA arriving at TEN
      # decimals, which `parseDecimal` refuses and `perBaseText` rounds once; a
      # sale's rebuilt gross landing on the keyed shelf price ($120.00/kg with 16%
      # IVA reads back exactly $120.00); the day's price being the LAST one typed
      # and not the average; the quantity filter dropping both the spine's empty
      # days and a day holding only a voided delivery (`line_count` would keep it);
      # a CASHIER reading the owner's rows on BOTH sides — `0040`, the owner's ruling
      # of 2026-09-25; and another shop reading none.
      - name: Contract — does app/src/api/prices.ts still describe the schema (plan 7b)
        run: bash docs/checks/7b-prices-contract.sh

      # And its six fixtures, each red for its OWN reason.
      - name: Contract — can the prices check still fail (its own six fixtures)
        run: bash docs/checks/7b-prices-contract-falsify.sh

      - name: Stop
        if: always()
        run: supabase stop --no-backup
