name: db

# ADR-035 §9: "Every schema claim in an ADR must be traceable to a migration that
# CI has applied and tested. A file is not evidence. A green CI run against a real
# Postgres is."
#
# This workflow is that evidence. It applies every migration in supabase/migrations/
# from scratch against a real Postgres, then runs the behavioural checks in
# supabase/tests/ against the result.
#
# The reset alone proves only that the DDL parses. The checks are what prove the
# constraints do their job — and, crucially, they run the isolation assertions
# under `set role authenticated`, because the postgres superuser bypasses RLS and
# would pass them vacuously.
#
# As of plan task 3.1 it also runs pgTAP suites (ADR-035 §2.10) between the two —
# 01 structural (3.1) and 02 behavioural RLS isolation on reads (3.2a). The step
# runs the DIRECTORY in name order, so a third suite costs no edit here.
#
# ⚠️ AS OF PLAN TASK 3.6b ONE SUITE READS A FILE FROM OUTSIDE supabase/. 07 builds
# its case tables from packages/money/cases.json — the same bytes Vitest reads —
# which is §2.10's "one data file, read by both". psql reads it CLIENT-SIDE
# (pg_read_file runs in the server, and the server is a container that cannot see
# this repo), relative to the working directory. That is why the loop below runs
# from the repo root, and why that path is in this workflow's `paths:` filter.
#
# THE pgTAP SUITES ADD TO supabase/tests/, THEY DO NOT REPLACE IT — this comment
# and supabase/README.md both used to say "replaces", which is a reading of
# ADR-035 §3 step 3 that the ADR does not actually make. §3 step 3 says which
# suites pgTAP is the home of; it says nothing about the 203 behavioural checks
# already standing, and rewriting working, falsified assertions into a second
# framework would risk a great deal to buy tidiness. See docs/PLAN.md task 3.1.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/db.yml"
      # ⚠️ THE CASE TABLE IS AN INPUT TO THIS WORKFLOW as of plan task 3.6b.
      # 07_money_and_units.sql reads packages/money/cases.json rather than its
      # own copy (ADR-035 §2.10, "one data file"), so a change to that file must
      # run the SQL side that reads it. Without this line the pgTAP half of the
      # paired-arithmetic claim would silently not run on the one commit most
      # likely to break it.
      - "packages/money/cases.json"
      # ⚠️ AND THE WORKSPACE MANIFESTS, as of plan task 3.7a. This workflow now
      # runs `npm ci` and a Vitest suite (supabase/vitest/), so the lockfile and
      # the root manifest decide what it installs. Without these two lines a
      # dependency bump could turn the concurrency suite red on main having
      # passed no PR — the same argument that put cases.json above.
      - "package.json"
      - "package-lock.json"
      # ⚠️⚠️ AND THE APP'S DATA LAYER, as of plan task 5b-i. This is the first
      # time a workflow over `supabase/**` has watched a file under `app/`, and
      # the reason is that `app/src/api/workspace.ts` is now a CLAIM ABOUT THE
      # APPLIED SCHEMA — the RPC's name, its three argument names, the columns
      # read off `workspace`. PostgREST resolves an RPC by its parameter names,
      # so a rename on either side of that line is a 404 (`PGRST202`) that the
      # typecheck, the Vitest suite and the bundler all pass straight over. Two
      # files, one claim — so an edit to EITHER has to re-run the check that
      # watches it, which is the same argument that put `packages/money/cases.json`
      # above and `docs/CONVENTIONS.md` in app.yml.
      - "app/src/api/**"
      - "docs/checks/5b-i-api-contract.sh"
      - "docs/checks/5b-i-api-contract-falsify.sh"
      # ⚠️⚠️ AND THE ROSTER'S, as of plan task 5b-ii-a. `app/src/api/members.ts`
      # is a second claim about the applied schema — two column lists — and it
      # carries something `workspace.ts` does not: a claim about a POLICY. The
      # owner ruled the roster manager-and-above on the measured asymmetry
      # between `workspace_invite_select` (manager) and `workspace_member_select`
      # (any member). A migration that loosened the first would make the client's
      # fence wrong, and NOTHING ELSE HERE WOULD GO RED — a policy that allows
      # more breaks no test. That is why `supabase/migrations/**` re-running this
      # is the point rather than a side effect.
      - "docs/checks/5b-ii-a-roster-contract.sh"
      - "docs/checks/5b-ii-a-roster-contract-falsify.sh"
      # ⚠️⚠️ AND THE NAME AT SIGN-UP, as of plan task 5b.7. This one watches
      # `app/src/auth/`, which no workflow over `supabase/**` has ever looked at
      # — and the reason is that `signUp`'s `options.data` is a claim about
      # GoTrue rather than about PostgREST: that the name a person types is
      # written to `raw_user_meta_data` and STAYS there. ⚠️ GoTrue does not
      # reject an unknown option and does not reject a missing one, so the
      # failure is a silent absence: the account is created, the shopkeeper
      # reaches her shop, and `5b.8`'s backfill later reads an empty column for
      # everyone who joined in between. They cannot be asked again.
      - "app/src/auth/**"
      - "docs/checks/5b.7-signup-name-contract.sh"
      - "docs/checks/5b.7-signup-name-contract-falsify.sh"
      # ⚠️⚠️ AND THE INVITE PATH, as of plan task 5b-ii-b-1. It watches
      # `app/src/api/invites.ts` because that module holds the four `p_` names
      # `create_invite` answers to, and PostgREST matches an RPC BY ITS
      # PARAMETER NAMES — so a rename there is a 404 the typecheck, the suite
      # and the bundler all pass over, reaching a shopkeeper as a button that
      # does nothing. ⚠️ It also asserts the one thing no suite can reach: that
      # the minted token is NOT in `workspace_invite`. Only the hash is stored
      # (`0002:364`), and if that stopped being true every Vitest assertion
      # would stay green with the secret sitting in a readable column.
      - "docs/checks/5b-ii-b-1-invite-contract.sh"
      - "docs/checks/5b-ii-b-1-invite-contract-falsify.sh"
      # ⚠️⚠️ AND THE OTHER HALF OF THE LOOP, as of plan task 5b-ii-b-2. It
      # watches `app/src/api/redeem.ts` for the reason above — a `p_` name is a
      # 404 nothing in `app/` can see — and for one this repository has not had
      # before: THE APP DECIDES WHICH RPC TO CALL BY MEASURING A LENGTH. An
      # invite token (16) and a shop's join code (8) are the same Crockford
      # alphabet and the same normaliser and carry no label, so length is the
      # whole decision (`P2`). It is sound only while `generate_invite_token`
      # mints sixteen and `workspace_code_shape` admits eight — both of which
      # live under `supabase/migrations/**`, which is why a migration re-running
      # this check is the point rather than a side effect.
      - "docs/checks/5b-ii-b-2-redeem-contract.sh"
      - "docs/checks/5b-ii-b-2-redeem-contract-falsify.sh"

# A later push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reset:
    name: supabase db reset
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned to the version 0001 was first verified against, so a CLI
          # release cannot turn a green schema red without a commit saying why.
          version: 2.114.0

      - name: Start local Postgres
        run: supabase start

      - name: Apply migrations from scratch
        run: supabase db reset

      # `db reset` exits non-zero if any migration fails to apply, so reaching this
      # step means the schema is real. Print it so a reviewer can read what landed.
      - name: Show applied schema
        run: supabase migration list --local

      # ---------------------------------------------------------------------
      # pgTAP SUITES (ADR-035 §2.10, plan tasks 3.1 and 3.2a)
      #
      # THIS STEP MUST STAY BETWEEN THE RESET AND THE SEED CHECKS, and unlike the
      # step below it the reason is not the seed — it is `public` itself. Every
      # file in supabase/checks/ creates `public._verify` and leaves it standing
      # on purpose so its results survive to be read, and _cleanup.sql truncates
      # rather than drops. Run the structural suite after either of them and it
      # sees three to five scaffolding tables with no RLS and no policies, and
      # reports failures that are not defects. Here it sees exactly what
      # `supabase db reset` produced, which is the thing the suite is about.
      #
      # The suite asserts that position rather than trusting it (test F2), so
      # moving this step down the file turns the job red instead of quiet.
      #
      # pgTAP IS NOT A MIGRATION. It is ~1000 functions and two views, and
      # migrations are append-only — shipping it as 0015 would put a test
      # framework in every production database with no way back. _setup.sql
      # installs it into its own schema `tap` for the length of this step and
      # _teardown.sql drops it, so the database the next step reads is the one
      # the reset built.
      #
      # A pgTAP file under plain psql prints "not ok" to stdout and EXITS 0 — a
      # failing suite that looks identical to a passing one from a workflow's
      # point of view. Each suite therefore ends with
      # `finish(exception_on_failure := true)`, which raises, so ON_ERROR_STOP
      # makes psql exit non-zero. Seven deliberate falsifications were confirmed
      # to fail this step before it was committed (docs/PLAN.md task 3.1), and
      # eight more before 02 was (task 3.2a).
      #
      # 02 WRITES A FIXTURE AND ROLLS IT BACK. `workspace_invite` is the one
      # tenant table the seed leaves empty in both workspaces, and an isolation
      # claim over zero rows is a claim about nothing. The file is one
      # transaction, so the database the steps below read is still the one the
      # reset built — which is also why this step stays above them.
      #
      # FILES BEGINNING WITH `_` ARE HARNESS, NOT SUITES — the same convention
      # supabase/tests/ already uses. The counter is the same concern as the one
      # below: a loop that matched nothing would print nothing and exit 0, which
      # is what a deleted suite directory looks like.
      #
      # ⚠️ AND THE THIRD WAY A FAILING SUITE EXITS 0, found in task 3.3 and the
      # reason each suite's output is now scanned rather than only its exit
      # code. `finish(exception_on_failure := true)` is what every file here
      # relies on to turn a red assertion into a non-zero exit, and pgTAP
      # DISARMS it when the plan does not match the number of tests run:
      #
      #     IF curr_test <> exp_tests THEN
      #         RETURN NEXT diag('Looks like you planned … but ran …');
      #     ELSIF num_faild > 0 THEN
      #         IF raise_ex THEN RAISE EXCEPTION …
      #
      # An ELSIF. A miscounted plan takes the first branch and the exception in
      # the second is never reached — so `not ok` lines print, psql exits 0, and
      # this step goes green. Every suite here computes its plan from what it
      # measured, so every suite can land in that branch. Reproduced in four
      # lines: plan(3), one passing test, one failing test, finish(true) → exit
      # 0; change the plan to 2 and the identical file raises.
      #
      # The grep below is the backstop for ALL FIVE suites, including the four
      # that merged before this was known. 05 carries a per-file guard as well,
      # so it also defends itself when run by hand outside CI.
      - name: pgTAP suites (ADR-035 §2.10)
        run: |
          eval "$(supabase status -o env | grep '^DB_URL=')"
          export DB_URL
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/pgtap/_setup.sql
          ran=0
          out="$(mktemp -d)"
          for f in $(ls supabase/pgtap/*.sql | sort); do
            case "$(basename "$f")" in _*) continue ;; esac
            echo "::group::$f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f" 2>&1 | tee "$out/$(basename "$f").log"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "$f failed (psql exit $rc)" >&2
              exit 1
            fi
            # The disarmed-exception check. A suite whose plan disagrees with
            # what it ran has NOT proved anything, whatever its exit code said.
            if grep -q 'Looks like you planned' "$out/$(basename "$f").log"; then
              echo "$f: plan/actual mismatch — pgTAP suppressed the failure exception" >&2
              grep 'Looks like you planned' "$out/$(basename "$f").log" >&2
              exit 1
            fi
            # Belt and braces: a `not ok` that reached this point reached it
            # because the exception did not fire.
            if grep -qE '^ *not ok [0-9]' "$out/$(basename "$f").log"; then
              echo "$f: failing assertions present despite a zero exit" >&2
              grep -E '^ *not ok [0-9]' "$out/$(basename "$f").log" >&2
              exit 1
            fi
            ran=$((ran + 1))
          done
          if [ "$ran" -eq 0 ]; then
            echo "no suites in supabase/pgtap/ — nothing was asserted" >&2
            exit 1
          fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/pgtap/_teardown.sql
          echo "$ran pgTAP suite(s) ran"

      # ---------------------------------------------------------------------
      # EVERY CHECK IN supabase/checks/, OVER SEED DATA (plan tasks 1.7 and 2.1)
      #
      # This step was the §2.4 invariant alone until 2.1 added the margin view's
      # reconciliation beside it. Both belong here for the same reason and neither
      # could live in supabase/tests/, so the step runs the directory rather than a
      # file, in name order.
      #
      # THIS STEP MUST STAY BETWEEN THE RESET AND THE SUITE LOOP, and the order is
      # the whole reason it is a step of its own rather than a file in
      # supabase/tests/. `_cleanup.sql` runs before every suite and truncates
      # every table but `unit`, so by the time the first suite starts the seed is
      # gone — and an invariant check over an empty database PASSES. That vacuous
      # green is the failure ADR-035 §9 exists to refuse, so the checks below
      # refuse to run at all until they can see a populated ledger.
      #
      # The reset above already ran the seed's own assertions, which raise and
      # exit non-zero. This is not those. Those ask whether each seed file wrote
      # what it meant to; this asks whether the projection agrees with the ledger
      # across all four of them at once, whether the projection can be thrown away
      # and rebuilt from stock_movement alone at seed scale, and whether
      # rebuild_batch_balance(workspace) respects its argument — which is a claim
      # no single-tenant fixture can make.
      #
      # It ends by corrupting the projection on purpose and confirming the check
      # catches it, so a green here is never a green from a check that cannot go
      # red.
      #
      # The file counter is the same concern as reading the suite counts by name:
      # a loop that matched nothing would print nothing and exit 0, which is what
      # a deleted check directory looks like.
      - name: Checks over the seed (ADR-035 §2.4, §2.9)
        run: |
          eval "$(supabase status -o env | grep '^DB_URL=')"
          export DB_URL
          ran=0
          for f in $(ls supabase/checks/*.sql | sort); do
            echo "::group::$f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          if [ "$ran" -eq 0 ]; then
            echo "no files in supabase/checks/ — nothing was checked over the seed" >&2
            exit 1
          fi
          echo "$ran seed check file(s) ran"

      # Every suite in supabase/tests/, in name order, against the database the
      # reset just built. Each one assumes a database holding nothing but its own
      # fixture — they share hardcoded user uuids and assert absolute counts — and
      # none of them can clean up after itself, because the ledger is append-only.
      #
      # SO EACH IS PRECEDED BY supabase/tests/_cleanup.sql, not by another
      # `supabase db reset`. The reset above still runs, once, and it is what
      # proves the migrations apply from scratch (ADR-035 §9); repeating it per
      # file bought nothing beyond an empty database and cost 20.5s a time against
      # the cleanup's 0.56s. The cleanup sweeps pg_tables dynamically and then
      # asserts it emptied what it claims, so an incomplete one fails loudly
      # instead of leaving the next suite counting someone else's rows.
      #
      # FILES BEGINNING WITH `_` ARE HARNESS, NOT SUITES, and are skipped here.
      #
      # ⚠️ THIS DIRECTORY IS ALL .sql AGAIN, AS OF PLAN TASK 3.7b. It held one .sh
      # — 0005_allocation_concurrency.sh, two real connections proving that two
      # concurrent allocations cannot oversell one batch (docs/PLAN.md task 1.3b) —
      # because that claim cannot be made from a single psql session. It is now
      # supabase/vitest/test/allocation-race.test.ts, in the step at the bottom of
      # this file, and the reasoning for moving rather than keeping it is recorded
      # under 3.7b. A .sh here would now fail loudly on the `unrecognised` branch
      # below rather than run, which is the right outcome: the two-connection home
      # in this repository is the Vitest workspace, not this loop.
      #
      # THE COUNTER IS THE SAME CONCERN AS THE OTHER TWO LOOPS. A glob that matched
      # nothing would print nothing and exit 0 — which is what this directory looks
      # like after a bad rebase, and it is one file emptier than it was.
      - name: Behavioural checks
        run: |
          eval "$(supabase status -o env | grep '^DB_URL=')"
          export DB_URL
          ran=0
          for f in $(ls supabase/tests/* | sort); do
            case "$(basename "$f")" in _*) continue ;; esac
            echo "::group::$f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/tests/_cleanup.sql
            case "$f" in
              *.sql) psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f" ;;
              *)     echo "unrecognised test file: $f" >&2; exit 1 ;;
            esac
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          if [ "$ran" -eq 0 ]; then
            echo "no suites in supabase/tests/ — nothing was asserted" >&2
            exit 1
          fi
          echo "$ran behavioural suite(s) ran"


      # ---------------------------------------------------------------------
      # THE TWO-CONNECTION SUITES — TypeScript (tasks 3.7a, 3.7b and 4c-ii)
      #
      # THREE CLAIMS, AND TWO OF THEM ARE §2.10's. idempotency.test.ts is that
      # row's second clause ("two identical calls, same id → exactly one row",
      # task 3.7a); availability-race.test.ts is its FIRST ("two sessions, last
      # unit, enforcement on → exactly one succeeds", task 4c-ii), which could
      # not be written until 0017 applied because there was no enforcement path
      # to switch on. §2.10's concurrency row is CLOSED as of that suite.
      # allocation-race.test.ts is docs/PLAN.md task 1.3b's claim about
      # allocate_fefo() — "two concurrent allocations cannot oversell one batch"
      # — which §2.10 never asked for and which ran as a .sh in supabase/tests/
      # until 3.7b ported it here. The last two assert OPPOSITE outcomes on
      # purpose: §2.10's enforcement clause refuses the loser, the allocator
      # makes it re-read and take the next lot. See docs/PLAN.md task 3.7b.
      #
      # THIS STEP MUST STAY LAST, below every psql step above it, and the reason
      # is the same one that fixes the order of all the others. The suite runs
      # supabase/tests/_cleanup.sql itself — the same file, not a copy — so by
      # the time it has built its fixture the seed is gone. Run it higher up and
      # the seed checks and pgTAP suites 02–07 would be measuring an empty
      # database.
      #
      # They would go RED, not quiet: every file in supabase/checks/ has a
      # pre-flight block that refuses to run unless the seed still holds what it
      # is about, and 02–07 assert absolute counts. That is deliberate on their
      # part and it is what makes this step's position safe to state rather than
      # merely hope for. It is still stated.
      #
      # WHY NODE IS HERE AND NOT IN money.yml. money.yml boots no database, which
      # is the whole reason it is a separate workflow — and §2.10's concurrency
      # row cannot be asserted without one. A single session cannot block on its
      # own lock, so this suite needs two real connections against the Postgres
      # the reset above built. It is the first thing in this workflow that
      # reaches the database through something other than psql, and that is the
      # point: node-postgres speaks the wire protocol, so the suite runs on a
      # machine with no Postgres client installed. The schema owner's machine is
      # such a machine (docs/PLAN.md, task 3.1), which is why the .sh this step
      # absorbed in 3.7b had never once been run outside CI — the argument that
      # decided 3.7b.
      #
      # ⚠️ THE COUNTER, AND WHY IT IS NOT OPTIONAL. 3.3 found that a suite can
      # print failures and exit 0; 3.6a found that a green tick is also what a
      # step that ran NOTHING looks like. Vitest exits non-zero on "No test files
      # found" — falsified by hand as V6 — but a suite that quietly SHRANK still
      # exits 0. The count is read from the JSON reporter, not scraped from the
      # terminal: money.yml's first spelling grepped the summary line and failed
      # its own first run on a green suite, because Vitest wraps that line in
      # ANSI colour codes.
      #
      # ⚠️ V6 IS WEAKER SINCE 3.7b, AND THE GAP IS THE SHRINK ONE ABOVE. With two
      # files here, deleting ONE no longer trips "No test files found" — the step
      # goes green on the other. The number in the log is what a reviewer reads
      # (29 as of 4c-ii, was 16); it is deliberately not pinned here, the same
      # call money.yml makes and for the same reason. Recorded in docs/PLAN.md.
      #
      # ⚠️⚠️ AND `if (!r.success)` IS THE ONLY GUARD BELOW THAT CATCHES A SUITE
      # WHICH DIED IN `beforeAll`, measured in 4c-ii. availability-race.test.ts
      # runs its three races there, so a schema defect that makes the FIRST
      # session's own call raise kills the file before one assertion executes.
      # The JSON reporter then says success:false, numTotalTests:29 and
      # numFailedTests:0 — the count guard and the failure guard BOTH pass, and
      # a green step would have asserted nothing about §2.10's concurrency row.
      # Observed under falsification W-F3. Do not simplify that first line away.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install (npm workspaces)
        run: npm ci

      - name: Vitest — two connections (ADR-035 §2.10, and task 1.3b's allocator race)
        run: |
          set -o pipefail
          eval "$(supabase status -o env | grep '^DB_URL=')"
          export DB_URL
          npm run test:db --workspace @tienda/db-concurrency -- \
            --reporter=default --reporter=json --outputFile="$PWD/vitest-db-report.json"
          node -e '
            const r = require("./vitest-db-report.json");
            if (!r.success) { console.error("suite reported failure"); process.exit(1); }
            if (!r.numTotalTests || r.numTotalTests < 1) {
              console.error("no tests ran — a green here would assert nothing");
              process.exit(1);
            }
            if (r.numFailedTests > 0) {
              console.error(`${r.numFailedTests} failing assertions`);
              process.exit(1);
            }
            console.log(`${r.numPassedTests} two-connection assertions ran against the reset database`);
          '

      # ⚠️⚠️ THE APP'S DATA LAYER, ASKED OF THE DATABASE ITSELF (plan task 5b-i).
      #
      # `app.yml` typechecks `app/src/api/` and runs a Vitest suite over it, and
      # NEITHER CAN SEE THE ONE DEFECT THAT MATTERS: TypeScript has never read
      # `0027`, so an argument renamed on either side of the wire is a 404 with
      # code `PGRST202` — "Could not find the function
      # public.onboard_workspace(display_name) in the schema cache" — that
      # compiles, bundles, passes 166 assertions and is first noticed by a
      # shopkeeper who cannot create her shop.
      #
      # It runs HERE rather than in app.yml because the evidence it needs is a
      # reset database with PostgREST and GoTrue in front of it, and that is
      # what this workflow already has standing. It reads the app's own strings
      # out of `app/src/api/workspace.ts` rather than carrying a second copy.
      - name: Contract — does app/src/api/ still describe the schema (plan 5b-i)
        run: bash docs/checks/5b-i-api-contract.sh

      # And its own six fixtures, for the reason app.yml states about the plan
      # guards: a check nobody has seen fail is a check nobody has shown can.
      # ⚠️ ITS FIRST RUN FOUND A DEFECT IN THE CHECK ABOVE — the argument reader
      # recognised an argument by the `p_` prefix it exists to test, so dropping
      # the prefix made it report "could not read the contract" instead of the
      # 404. Red for the wrong reason, which is the failure this harness is
      # written to match on rather than trusting an exit code.
      - name: Contract — can that check still fail (its own six fixtures)
        run: bash docs/checks/5b-i-api-contract-falsify.sh

      # ⚠️⚠️ AJUSTES' ROSTER, ASKED OF THE DATABASE AND OF ITS POLICIES (plan
      # task 5b-ii-a). Three real people in three real roles: the founding owner,
      # a manager who redeemed an invite, and a staff member who redeemed
      # another. It asserts the two column lists against the real tables, that
      # the client-side join has something to join on, that the founding owner
      # has no invite row (`T2`), that `token_hash` never reaches the app — and,
      # the assertion no other check in this repository can make, that a STAFF
      # caller still reads the roster and zero invites. That asymmetry is what
      # the owner's ruling of 2026-09-18 was ruled ON.
      - name: Contract — does Ajustes' roster still describe the schema (plan 5b-ii-a)
        run: bash docs/checks/5b-ii-a-roster-contract.sh

      # And its own eleven fixtures. ⚠️ TWO OF THEM MOVE AN APPLIED POLICY IN
      # PLACE, run the check, and put it back — because those two assertions
      # cannot be falsified by editing a TypeScript file, and a fixture nobody
      # can write is an assertion nobody has shown can fail. Each restore is
      # trapped on every exit path and then asserted by a second green run.
      # ⚠️ `G5` LOOSENS the invite policy: the roster's manager fence exists
      # because staff cannot read `workspace_invite`. ⚠️⚠️ `G8` NARROWS
      # `workspace_member_select` — the fence the owner DECLINED on 2026-09-18
      # when he ruled "leave it" on a cashier reading her colleagues' names, and
      # the fixture that keeps `5b.8-ii`'s retirement of two split-guard
      # sentinels honest: that retirement rests on assertion 9, so assertion 9
      # has to be able to fail. A narrowed policy left behind makes the whole
      # tree look broken rather than safe, which is why its restore is asserted
      # in its own right.
      # ⚠️ Its first run found a real defect in the check above: a PostgREST 400
      # body quotes the column it thinks you meant, and pasting that into a
      # Python literal made the check say "unreadable" where it owed the column's
      # name. Red for the wrong reason — the same shape 5b-i's harness found in
      # its sister on ITS first run.
      - name: Contract — can the roster check still fail (its own eleven fixtures)
        run: bash docs/checks/5b-ii-a-roster-contract-falsify.sh

      # ⚠️⚠️ THE NAME A PERSON TYPES AT SIGN-UP (plan task 5b.7). The plan row
      # says it in one sentence: *"a round trip is the evidence, not the file."*
      # Everything up to the last hop is ours and `app/test/credentials.test.ts`
      # covers it; that GoTrue writes `options.data` into `raw_user_meta_data`
      # and keeps it is a claim about somebody else's system, and ADR-035 §9
      # says a green CI run is what settles those. It signs a person up with
      # accents and two surnames, signs them back IN on a second request that
      # never saw the first one's body, and reads the same string back.
      - name: Contract — does the name survive signUp (plan 5b.7)
        run: bash docs/checks/5b.7-signup-name-contract.sh

      # And its own seven fixtures. ⚠️ ONE OF THEM SILENCES THE PROBE rather
      # than editing the app, for the reason the roster harness gives about the
      # policy it loosens: no line in `app/` can make GoTrue lose what it was
      # given, so that is the only way to show the two assertions which read the
      # wire can go red at all. ⚠️ Its first run caught this check reporting
      # `bad_json` where it owed "the field was absent" — red for the wrong
      # reason, the third time that shape has appeared in a contract check here.
      - name: Contract — can the sign-up name check still fail (its own seven fixtures)
        run: bash docs/checks/5b.7-signup-name-contract-falsify.sh

      # ⚠️⚠️ THE INVITE PATH (plan task 5b-ii-b-1). Nine assertion groups over one
      # reset database with three real people and two stores. The two that
      # nothing else in this repository can make: the minted token is nowhere in
      # `workspace_invite` — only the hash is stored — and a STAFF caller is
      # refused `42501` by the fence in `create_invite`'s BODY, which is where it
      # has to be because §2.7's "under normal RLS" cannot supersede a row
      # (`5b.8` owes that amendment, ruled 2026-09-18).
      - name: Contract — does create_invite answer to what the app sends (plan 5b-ii-b-1)
        run: bash docs/checks/5b-ii-b-1-invite-contract.sh

      # And its own nine fixtures, in about fifteen seconds. ⚠️ TWO OF THEM
      # MUTATE THE PROBE rather than the app, for the reason the sign-up harness
      # above gives: no line in `app/` can make Postgres store a plaintext token
      # or drop its own fence, and a fixture nobody can write is an assertion
      # nobody has shown can fail. ⚠️ Its own fixtures caught TWO defects in the
      # check while it was being written — an assertion that could not fail, and
      # one that was red for the wrong reason.
      #
      # ⚠️⚠️ AND THIS STEP WAS CANCELLED ON ITS FIRST CI RUN, at the 15-minute job
      # cap, because the harness reset the database once per fixture on a comment
      # that claimed the reset was required and had never been tested. It is not:
      # every run mints a fresh workspace and fresh addresses, so nothing can
      # collide. A CANCELLED step is neither a pass nor a failure, which makes it
      # the worst of the three to merge on.
      - name: Contract — can the invite check still fail (its own nine fixtures)
        run: bash docs/checks/5b-ii-b-1-invite-contract-falsify.sh

      # ⚠️⚠️ THE REDEMPTION (plan task 5b-ii-b-2), AND IT CLOSES THE LOOP THE
      # STEP ABOVE OPENS: an owner mints a token there, a second person spends it
      # here, and there are two people in the shop. Nine assertion groups over one
      # reset database with three real people, one shop and two stores.
      #
      # ⚠️ The one nothing else in this repository can make: THAT SIXTEEN AND
      # EIGHT ARE STILL THE TWO LENGTHS. `@/api/redeem` chooses which RPC to call
      # by measuring what a person typed, because the two credentials are
      # indistinguishable otherwise — so if either length moved, every Vitest
      # assertion would stay green while this app sent a joiner down the wrong
      # path. §2.11 refuses the rendering suite that would notice.
      - name: Contract — does redeem_invite answer to what the app sends (plan 5b-ii-b-2)
        run: bash docs/checks/5b-ii-b-2-redeem-contract.sh

      # And its own nine fixtures, in about seventeen seconds. ⚠️ TWO OF THEM
      # MUTATE THE PROBE rather than the app, for the reason the two harnesses
      # above give: no line in `app/` can make Postgres admit a stranger or stop
      # being idempotent, and a fixture nobody can write is an assertion nobody
      # has shown can fail. ⚠️ AND NONE OF THEM RESETS THE DATABASE — the sibling
      # harness was CANCELLED at the 15-minute job cap for doing that, on a
      # comment claiming the reset was required that had never been tested.
      - name: Contract — can the redemption check still fail (its own nine fixtures)
        run: bash docs/checks/5b-ii-b-2-redeem-contract-falsify.sh

      - name: Stop
        if: always()
        run: supabase stop --no-backup
