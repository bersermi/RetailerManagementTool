name: app

# THE THIRD WORKFLOW, AND THE HOLE IT CLOSES IS IN THE PROJECT'S FOUNDING RULE.
#
# `db.yml` fires on `supabase/**`; `money.yml` fires on `packages/**`. Until this
# file existed, NEITHER MATCHED AN APP DIRECTORY — so "a file is not evidence; a
# green CI run is" (ADR-035 §9), the rule this repository exists to enforce and
# the rule the previous era died for want of, stopped applying at exactly the
# point the codebase starts growing fastest. A green tick on the first app
# commit would have meant the two existing workflows correctly decided they had
# nothing to do.
#
# It ships on the FIRST app commit rather than the first interesting one,
# deliberately (plan task 5a-i). A `paths:` filter added later is a filter that
# was wrong for every commit that merged before it.
#
# ⚠️ THE TEST STEP EXISTS BECAUSE THE ADR WAS AMENDED TO ALLOW IT, 2026-09-07.
# §2.11's stack table used to say client tests were "skipped, except
# packages/money", which would have made this workflow a typecheck and nothing
# more — and A TYPECHECK CANNOT FAIL ON AN APP THAT CHARGES THE WRONG AMOUNT. It
# asks whether the code makes sense to the compiler, not whether it is right.
# The amendment draws the line where §2.10's prose always drew it: a unit test
# is in scope where it pins a VALUE a customer sees or the ledger stores, and
# out of scope over rendering, navigation and layout. `app/vitest.config.ts`
# collects `test/**` only, so that boundary is structural here rather than
# remembered.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "app/**"
      # ⚠️ `packages/money/**` IS HERE ON PURPOSE AND IT IS NOT A DUPLICATE OF
      # money.yml. The app imports `@tienda/money`, so a change there can break
      # THIS workspace's typecheck while money.yml stays green on its own suite.
      # The two workflows assert different things about the same edit.
      - "packages/money/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/app.yml"
      # ⚠️ THE CONVENTIONS PAGE AND ITS GUARD ARE IN THIS FILTER ON PURPOSE
      # (plan task 5a-iv-b). `docs/CONVENTIONS.md` is a page of claims ABOUT
      # `app/**`, so an edit to the page alone must re-run the check that reads
      # it — otherwise the one file whose whole job is to stop a stale claim is
      # itself the one edit CI never looks at.
      - "docs/CONVENTIONS.md"
      - "docs/checks/conventions-gate.sh"
      # ⚠️⚠️ AND THE HARNESS THAT FALSIFIES IT, ADDED 2026-09-17 AT `5b.6` —
      # IT HAD NEVER BEEN IN ANY WORKFLOW. Two other falsification harnesses are
      # run below (`4.6a-` and `5b-split-coverage-falsify.sh`); the repository's
      # ONLY committed harness for a STANDING gate was hand-run by whichever
      # session remembered, which is the same sentence written forty lines above
      # about the two plan guards, and the same rule: a guard nobody runs is a
      # file. ⚠️ It is not hypothetical. It spent a day dead when the gate gained
      # an input the harness did not copy, and on 2026-09-17 `5b.6` found TWO
      # more dead fixtures in it — `F12`, disarmed by that very task adding one
      # source file, and `F10`, stale by the mechanism its own comment had
      # predicted. Both were found by running it by hand. There will not always
      # be a hand.
      - "docs/checks/conventions-gate-falsify.sh"
      # ⚠️ AND `docs/PLAN.md`, ADDED 2026-09-13 WITH THE `5b.5` CROSS-CHECK. The
      # gate asserts that the page's deferral and the plan row it names agree
      # about whether a pass of that page is still owed. ⚠️ As of 2026-09-18 the
      # TASK ID IS READ from both files rather than hardcoded in the script —
      # `5b.5` wrote the `src/api/` half and moved the `src/ui/` half to `5h.5`,
      # and the old spelling would have gone green on exactly that edit.
      # Two files, one claim — so an edit to EITHER has to re-run the check, and
      # closing that task in the plan alone is exactly the edit that would
      # otherwise leave the page sending juniors to a task that no longer exists.
      - "docs/PLAN.md"
      # ⚠️⚠️ AND `docs/HANDBOOK.md`, ADDED 2026-09-18 WITH THE HANDBOOK GUARD, AND
      # THIS LINE IS THE WHOLE POINT OF IT. The guard reads two files; a filter
      # naming only one of them means a HANDBOOK-ONLY edit — which is exactly the
      # shape of every staleness it exists to catch — runs no check at all and
      # merges green. `conventions-gate-falsify.sh` spent a day dead in precisely
      # this way on 2026-09-13: WHEN AN ASSERTION GAINS A NEW INPUT, EVERYTHING
      # THAT RUNS IT GAINS THE SAME INPUT.
      - "docs/HANDBOOK.md"
      # ⚠️⚠️ AND THE TWO PLAN GUARDS, ADDED 2026-09-13 WITH THE `5a-iv-c` SPLIT.
      # Until that day NEITHER `plan-handover.sh` NOR `5a-split-coverage.sh` was
      # run by any workflow — they existed, they were thorough, and they had
      # only ever been run by hand by the session that wrote them. That is this
      # repository's founding rule failing on the file the rule is kept in:
      # "a file is not evidence; a green CI run is" (ADR-035 §9), and a guard
      # nobody runs is a file. It is also the specific way the six stale-copy
      # defects survived — every one of them was found by a person reading.
      - "docs/checks/plan-handover.sh"
      - "docs/checks/5a-split-coverage.sh"
      # ⚠️⚠️ AND THE THIRD PLAN GUARD, ADDED 2026-09-13 WITH THE `4.6a` SPLIT —
      # PLUS `supabase/README.md`, WHICH IS THE FIRST TIME ANY WORKFLOW HAS PUT
      # THAT FILE IN A FILTER. `4.6a-split-coverage.sh` asserts that the plan and
      # the database doc agree about which task owns `0027`–`0031`, and the
      # SEVENTH stale-copy defect in this repository was in exactly that file:
      # it called `0026` the last migration of the build for six days after step
      # 4.6 was created. Two files, one claim — so an edit to EITHER has to
      # re-run the check, and a correction made only in the database doc is
      # precisely the edit that would otherwise never be looked at.
      - "docs/checks/4.6a-split-coverage.sh"
      - "docs/checks/4.6a-split-coverage-falsify.sh"
      - "supabase/README.md"
      # ⚠️ THE FOURTH PLAN GUARD, ADDED 2026-09-14 WITH THE `5b` SPLIT. It reads
      # `docs/PLAN.md` and nothing else, so it needs no second path here — which
      # is itself the point: `conventions-gate-falsify.sh` spent a day dead
      # because the gate it falsifies gained an input file the harness was never
      # told about, and the rule that came out of that day is that an assertion
      # and the thing that falsifies it read the same set of files.
      - "docs/checks/5b-split-coverage.sh"
      - "docs/checks/5b-split-coverage-falsify.sh"
      # ⚠️ AND THE SUB-SPLIT'S GUARD, added 2026-09-18 when `5b-ii` was sized `L`
      # and split in two. It is in the filter and in the steps below on the same
      # commit that created it, which is the only arrangement that has never gone
      # wrong here: `conventions-gate-falsify.sh` existed for ten days before any
      # workflow ran it, and spent one of them dead without anything going red.
      - "docs/checks/5b-ii-split-coverage.sh"
      - "docs/checks/5b-ii-split-coverage-falsify.sh"
      # ⚠️ AND THE THIRD GENERATION, added 2026-09-18 when `5b-ii-b` was sized `L`
      # and split in two. Three guards now watch three levels of one step's split,
      # and they do not overlap: each matches `| **<task>** |` including the
      # closing pipe, which is what keeps `5b-ii-b` from matching `5b-ii-b-1`.
      - "docs/checks/5b-ii-b-split-coverage.sh"
      - "docs/checks/5b-ii-b-split-coverage-falsify.sh"
      # ⚠️ AND THE FOURTH, added 2026-09-18 when `5b.8` was sized `L` and split
      # three ways. ⚠️⚠️ IT IS THE FIRST SPLIT GUARD WATCHING A TASK THAT SHIPS A
      # MIGRATION: a deliverable that falls out of `5b.8` is not a control nobody
      # builds, it is a column nobody fills, deployed by an automated merge.
      # ⚠️ `5b.8-i` is a prefix of BOTH its siblings, which is why the closing
      # pipe in the matcher matters more here than in the three above.
      - "docs/checks/5b.8-split-coverage.sh"
      - "docs/checks/5b.8-split-coverage-falsify.sh"
      # ⚠️⚠️ AND THE SPLIT UNDER IT, added 2026-09-19. `5b.8-iii` was re-sized to
      # an `L` and split in two on the day it was taken, exactly as its own gate
      # cell had ordered since 2026-09-18. THE SECOND MIGRATION-BEARING SPLIT
      # GUARD: `5b.8-iii-a` ships a `security definer` RPC, and a deliverable
      # that falls out of it is deployed, not reviewed.
      # ⚠️ THE PARENT IS A STRICT PREFIX OF BOTH CHILDREN here, which is the
      # worst instance of the trap the comment above names — `5b.8-iii` inside
      # `5b.8-iii-a`. The closing pipe in the matcher is what separates them, and
      # the harness's `S1` fixture is what proves it still does.
      - "docs/checks/5b.8-iii-split-coverage.sh"
      - "docs/checks/5b.8-iii-split-coverage-falsify.sh"
      # ⚠️⚠️ AND THE SIXTH GENERATION, added 2026-09-19. `5b-iii` was re-sized to an
      # `XL` and split FOUR ways on the day it was taken, exactly as its own gate
      # cell had ordered since 2026-09-18. THE FIRST SPLIT GUARD WATCHING A TASK
      # THAT SHIPS TWO MIGRATIONS: `5b-iii-a` mints two application SQLSTATEs and
      # `5b-iii-c` writes a `security definer` read, and a deliverable that falls
      # out of either is deployed, not reviewed.
      # ⚠️ THE PREFIX CHAIN IS THREE DEEP HERE — `5b-i` inside `5b-iii` inside all
      # four children — which is the worst instance in this directory of the trap
      # the comments above name. The closing pipe in the matcher is what separates
      # them, and the harness's `S1` and `S9` fixtures are what prove it still does.
      # ⚠️⚠️ AND ITS HARNESS CARRIES TWO CROSS-GUARD FIXTURES, which no older one
      # here has: `X1` runs `5b-split-coverage.sh` and `X2` runs `plan-handover.sh`
      # against the same tree, because this split makes a claim about both of them.
      # Their paths are already in this filter above, so nothing new is needed —
      # which is itself the rule `conventions-gate-falsify.sh` spent a day dead for.
      - "docs/checks/5b-iii-split-coverage.sh"
      - "docs/checks/5b-iii-split-coverage-falsify.sh"
      # ⚠️⚠️ AND THE HANDBOOK GUARD, added 2026-09-18 on the owner's instruction.
      # ⚠️ IT IS THE FIRST CHECK IN THIS REPOSITORY THAT READS `docs/HANDBOOK.md`
      # AT ALL — until it existed, the one document the OWNER reads was the one
      # document no machine looked at, and it went stale in six rows across two
      # occasions. It asserts AGREEMENT with `docs/PLAN.md`, never judging the
      # plan, so it is not the second status board `plan-handover.sh` refuses.
      - "docs/checks/handbook-agreement.sh"
      - "docs/checks/handbook-agreement-falsify.sh"
      # ⚠️⚠️ AND ADR-035, ADDED 2026-09-13 WITH THE §3 AMENDMENT. The conventions
      # gate now cross-checks the `5b.5` deferral across THREE files, the ADR
      # among them. An ADR-only edit that re-claimed `src/api`/`src/ui` for step
      # `5a` — which is exactly the edit a session obeying "the ADR wins" would
      # make if the amendment were lost — would otherwise never re-run the check
      # that watches for it. Same argument as `docs/CONVENTIONS.md` above: the
      # one file whose job is to stop a stale claim must not be the one edit CI
      # never looks at.
      - "docs/adr/ADR-035-target-architecture-postgres-react-native.md"

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: app (node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # ONE NODE VERSION, AND THE ASYMMETRY WITH money.yml IS DELIBERATE.
      # money.yml runs 22 and 24 because its subject is integer arithmetic that
      # "should not" depend on the engine — and "should not" is the class of
      # statement §1 exists to distrust, so it is measured. That measurement
      # already exists and this workflow would not add to it: the app's suite
      # calls the same functions across a workspace edge. 22 is the floor the
      # root manifest's `engines` declares.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # `npm ci` and not `npm install`: the lockfile is the pinned input, the
      # same argument that pins the Supabase CLI version in db.yml.
      - name: Install
        run: npm ci

      # ⚠️ THIS STEP IS THE ONE THAT CAN FAIL ON A MISSING WORKSPACE ENTRY.
      # `--workspace @tienda/app` exits non-zero if the root manifest does not
      # declare it, so "the fourth workspace is registered" is asserted by the
      # run rather than by reading package.json.
      - name: Typecheck
        run: npm run typecheck --workspace @tienda/app

      # ⚠️ THE COUNTER, AND WHY IT IS HERE — the same guard money.yml carries,
      # for the same reason. 3.3 found that a suite can print `not ok` and exit
      # 0, and the lesson generalised: A GREEN TICK IS ALSO WHAT A STEP THAT
      # ASSERTED NOTHING LOOKS LIKE. This repository has now hit four shapes of
      # that (3.3's disarmed pgTAP exception, 3.6a's empty Vitest workspace,
      # 4b-i's `where not passed`, and 5a-i's own falsification fixture that
      # edited nothing). "No test files found" is the one that would otherwise
      # be silent here, and Vitest exits non-zero on it.
      #
      # The count is READ FROM THE JSON REPORTER, not scraped from the terminal:
      # money.yml's first spelling grepped the summary line and failed its own
      # first CI run on a GREEN suite, because Vitest wraps that line in ANSI
      # colour codes. The reporter is a contract; the formatting is not.
      - name: Vitest — the workspace-boundary suite (plan 5a-i)
        run: |
          set -o pipefail
          npm run test --workspace @tienda/app -- \
            --reporter=default --reporter=json --outputFile="$PWD/vitest-report.json"
          node -e '
            const r = require("./vitest-report.json");
            if (!r.success) { console.error("suite reported failure"); process.exit(1); }
            if (!r.numTotalTests || r.numTotalTests < 1) {
              console.error("no tests ran — a green here would assert nothing");
              process.exit(1);
            }
            if (r.numFailedTests > 0) {
              console.error(`${r.numFailedTests} failing assertions`);
              process.exit(1);
            }
            console.log(`${r.numPassedTests} assertions ran over the app workspace boundary`);
          '

      # ⚠️ LAST, AND DELIBERATELY NOT FIRST. Plan task 5a-iv-b. The two steps
      # above assert CORRECTNESS — does it compile, does it compute the right
      # number. This one asserts FORM: is `docs/CONVENTIONS.md` still describing
      # the codebase a junior is about to add a file to. A red form check placed
      # ahead of a red correctness check hides it and costs a round trip, and
      # form is the cheaper of the two to fix.
      #
      # It needs no node and no install — it is bash over the working tree — so
      # its position here costs nothing but the ordering.
      - name: Conventions — is docs/CONVENTIONS.md still true of app/ (plan 5a-iv-b)
        run: bash docs/checks/conventions-gate.sh

      # ⚠️⚠️ AND CAN THAT GATE STILL FAIL. Added 2026-09-17 (plan task `5b.6`).
      # The step above prints "all N assertion groups passed", and that sentence
      # is ALSO what a gate which stopped reading the files prints — rule 4 of
      # this repository. This is what distinguishes the two: twenty-seven
      # fixtures, twenty-six of which must turn that gate red and one of which
      # must leave it green, each a copy of the tree with exactly one thing
      # broken. ⚠️ The count is in that harness's own anti-vacuity floor; it is
      # deliberately NOT repeated in this step's name, because `5b.5` found the
      # number stale in three places at once.
      #
      # ⚠️ IT WRITES NOTHING TO THE TREE (mktemp, trapped) and needs no node, so
      # it costs seconds. That it was not here is why two of its fixtures were
      # silently dead until a session ran it by hand.
      - name: Conventions — can that gate still fail (its own fixtures)
        run: bash docs/checks/conventions-gate-falsify.sh

      # ⚠️⚠️ THE TWO PLAN GUARDS, WIRED IN 2026-09-13 (plan task 5a-iv-c-1).
      #
      # They are not new — `5a-split-coverage.sh` has been catching real defects
      # since 2026-09-11 and `plan-handover.sh` since 2026-09-13. What is new is
      # that a machine runs them. Before this, BOTH were hand-run by whichever
      # session happened to remember, which means their green was a claim about
      # that session's diligence and not about the file. `docs/PLAN.md` is the
      # one file a cleared session reads to decide what to do next; it is also
      # the file with six recorded stale-duplicate defects, five of them found
      # by a person reading rather than by either of these scripts running.
      #
      # ⚠️ `plan-handover.sh` asserts a clean working tree. On a checkout that
      # is free, which is the point: the assertion is aimed at the owner's Mac,
      # where it is not.
      - name: Plan — can a cleared session find the next task (plan 5a-iv-c-1)
        run: bash docs/checks/plan-handover.sh

      - name: Plan — did any split lose a deliverable (plan 5a-iv-c-1)
        run: bash docs/checks/5a-split-coverage.sh

      # ⚠️⚠️ THE THIRD PLAN GUARD, AND THE FIRST TO READ OUTSIDE `docs/` (the
      # `4.6a` split, 2026-09-13). It holds register #9's eight rulings to three
      # child tasks and the five migration numbers to one task each, across
      # `docs/PLAN.md` AND `supabase/README.md`.
      - name: Plan — did the 4.6a split lose a ruling (plan 4.6a sizing)
        run: bash docs/checks/4.6a-split-coverage.sh

      # ⚠️ AND THE GUARD'S OWN FALSIFICATIONS, WHICH IS NEW HERE. The other two
      # plan checks are run by CI; the fixtures proving they can FAIL are not,
      # which means a future edit that loosens one into a check that passes on
      # everything would be green twice over. This runs the eight fixtures the
      # split guard was falsified against — it is bash and python3 over two
      # temporary copies, it costs about a second, and it is the difference
      # between "the check passed" and "the check can still fail".
      - name: Plan — can the 4.6a guard still fail (its own eight fixtures)
        run: bash docs/checks/4.6a-split-coverage-falsify.sh

      # ⚠️⚠️ THE FOURTH PLAN GUARD (the `5b` split, 2026-09-14), AND THE FIRST
      # OVER A CLIENT TASK. `5b`'s children ship NO migration, so a deliverable
      # lost between them never becomes a deployed mistake — it becomes a screen
      # nobody builds, found by the owner during a pilot, on his own phone. That
      # is a slower failure and a cheaper one, and it is also the kind nothing
      # else in this repository can see: §2.11 bans rendering suites, so no test
      # will ever notice that C11.7's share button was not built.
      - name: Plan — did the 5b split lose a deliverable (plan 5b sizing)
        run: bash docs/checks/5b-split-coverage.sh

      # And its own fixtures, for the reason the block above states.
      - name: Plan — can the 5b guard still fail (its own eleven fixtures)
        run: bash docs/checks/5b-split-coverage-falsify.sh
      - name: Plan — did the 5b-ii split lose a deliverable (plan 5b-ii sizing)
        run: bash docs/checks/5b-ii-split-coverage.sh
      - name: Plan — can the 5b-ii guard still fail (its own ten fixtures)
        run: bash docs/checks/5b-ii-split-coverage-falsify.sh
      - name: Plan — did the 5b-ii-b split lose a deliverable (plan 5b-ii-b sizing)
        run: bash docs/checks/5b-ii-b-split-coverage.sh
      - name: Plan — can the 5b-ii-b guard still fail (its own nine fixtures)
        run: bash docs/checks/5b-ii-b-split-coverage-falsify.sh
      - name: Plan — 5b.8 split coverage (fourth generation, and it guards a migration)
        run: bash docs/checks/5b.8-split-coverage.sh
      - name: Plan — can the 5b.8 guard still fail (its own ten fixtures)
        run: bash docs/checks/5b.8-split-coverage-falsify.sh
      - name: Plan — 5b.8-iii split coverage (fifth generation, and it guards an RPC)
        run: bash docs/checks/5b.8-iii-split-coverage.sh
      - name: Plan — can the 5b.8-iii guard still fail (its own twelve fixtures)
        run: bash docs/checks/5b.8-iii-split-coverage-falsify.sh
      - name: Plan — 5b-iii split coverage (sixth generation, and it guards two migrations)
        run: bash docs/checks/5b-iii-split-coverage.sh
      - name: Plan — can the 5b-iii guard still fail (its own sixteen fixtures)
        run: bash docs/checks/5b-iii-split-coverage-falsify.sh
      - name: Handbook — does the file the owner reads still agree with the plan
        run: bash docs/checks/handbook-agreement.sh
      - name: Handbook — can that guard still fail (its own eleven fixtures)
        run: bash docs/checks/handbook-agreement-falsify.sh
