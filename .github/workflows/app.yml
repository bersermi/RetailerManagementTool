name: app

# THE THIRD WORKFLOW, AND THE HOLE IT CLOSES IS IN THE PROJECT'S FOUNDING RULE.
#
# `db.yml` fires on `supabase/**`; `money.yml` fires on `packages/**`. Until this
# file existed, NEITHER MATCHED AN APP DIRECTORY — so "a file is not evidence; a
# green CI run is" (ADR-035 §9), the rule this repository exists to enforce and
# the rule the previous era died for want of, stopped applying at exactly the
# point the codebase starts growing fastest. A green tick on the first app
# commit would have meant the two existing workflows correctly decided they had
# nothing to do.
#
# It ships on the FIRST app commit rather than the first interesting one,
# deliberately (plan task 5a-i). A `paths:` filter added later is a filter that
# was wrong for every commit that merged before it.
#
# ⚠️ THE TEST STEP EXISTS BECAUSE THE ADR WAS AMENDED TO ALLOW IT, 2026-09-07.
# §2.11's stack table used to say client tests were "skipped, except
# packages/money", which would have made this workflow a typecheck and nothing
# more — and A TYPECHECK CANNOT FAIL ON AN APP THAT CHARGES THE WRONG AMOUNT. It
# asks whether the code makes sense to the compiler, not whether it is right.
# The amendment draws the line where §2.10's prose always drew it: a unit test
# is in scope where it pins a VALUE a customer sees or the ledger stores, and
# out of scope over rendering, navigation and layout. `app/vitest.config.ts`
# collects `test/**` only, so that boundary is structural here rather than
# remembered.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "app/**"
      # ⚠️ `packages/money/**` IS HERE ON PURPOSE AND IT IS NOT A DUPLICATE OF
      # money.yml. The app imports `@tienda/money`, so a change there can break
      # THIS workspace's typecheck while money.yml stays green on its own suite.
      # The two workflows assert different things about the same edit.
      - "packages/money/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/app.yml"
      # ⚠️ THE CONVENTIONS PAGE AND ITS GUARD ARE IN THIS FILTER ON PURPOSE
      # (plan task 5a-iv-b). `docs/CONVENTIONS.md` is a page of claims ABOUT
      # `app/**`, so an edit to the page alone must re-run the check that reads
      # it — otherwise the one file whose whole job is to stop a stale claim is
      # itself the one edit CI never looks at.
      - "docs/CONVENTIONS.md"
      - "docs/checks/conventions-gate.sh"
      # ⚠️⚠️ AND THE HARNESS THAT FALSIFIES IT, ADDED 2026-09-17 AT `5b.6` —
      # IT HAD NEVER BEEN IN ANY WORKFLOW. The repository's
      # ONLY committed harness for a STANDING gate was hand-run by whichever
      # session remembered, which is the same sentence written forty lines above
      # about the two plan guards, and the same rule: a guard nobody runs is a
      # file. ⚠️ It is not hypothetical. It spent a day dead when the gate gained
      # an input the harness did not copy, and on 2026-09-17 `5b.6` found TWO
      # more dead fixtures in it — `F12`, disarmed by that very task adding one
      # source file, and `F10`, stale by the mechanism its own comment had
      # predicted. Both were found by running it by hand. There will not always
      # be a hand.
      - "docs/checks/conventions-gate-falsify.sh"
      # ⚠️ AND `docs/PLAN.md`, ADDED 2026-09-13 WITH THE `5b.5` CROSS-CHECK. The
      # gate asserts that the page's deferral and the plan row it names agree
      # about whether a pass of that page is still owed. ⚠️ As of 2026-09-18 the
      # TASK ID IS READ from both files rather than hardcoded in the script —
      # `5b.5` wrote the `src/api/` half and moved the `src/ui/` half to `5h.5`,
      # and the old spelling would have gone green on exactly that edit.
      # Two files, one claim — so an edit to EITHER has to re-run the check, and
      # closing that task in the plan alone is exactly the edit that would
      # otherwise leave the page sending juniors to a task that no longer exists.
      - "docs/PLAN.md"
      # ⚠️⚠️ AND `docs/HANDBOOK.md`, ADDED 2026-09-18 WITH THE HANDBOOK GUARD, AND
      # THIS LINE IS THE WHOLE POINT OF IT. The guard reads two files; a filter
      # naming only one of them means a HANDBOOK-ONLY edit — which is exactly the
      # shape of every staleness it exists to catch — runs no check at all and
      # merges green. `conventions-gate-falsify.sh` spent a day dead in precisely
      # this way on 2026-09-13: WHEN AN ASSERTION GAINS A NEW INPUT, EVERYTHING
      # THAT RUNS IT GAINS THE SAME INPUT.
      - "docs/HANDBOOK.md"
      # ⚠️ THE PLAN GUARD, 2026-09-13. The split-coverage guards that stood beside it
      # were retired by the owner on 2026-09-29 (plan task 8b's decision): every split
      # they checked was closed and archived.
      - "docs/checks/plan-handover.sh"
      # ⚠️⚠️ AND THE HANDBOOK GUARD, added 2026-09-18 on the owner's instruction.
      # ⚠️ IT IS THE FIRST CHECK IN THIS REPOSITORY THAT READS `docs/HANDBOOK.md`
      # AT ALL — until it existed, the one document the OWNER reads was the one
      # document no machine looked at, and it went stale in six rows across two
      # occasions. It asserts AGREEMENT with `docs/PLAN.md`, never judging the
      # plan, so it is not the second status board `plan-handover.sh` refuses.
      - "docs/checks/handbook-agreement.sh"
      - "docs/checks/handbook-agreement-falsify.sh"
      # ⚠️⚠️ AND ADR-035, ADDED 2026-09-13 WITH THE §3 AMENDMENT. The conventions
      # gate now cross-checks the `5b.5` deferral across THREE files, the ADR
      # among them. An ADR-only edit that re-claimed `src/api`/`src/ui` for step
      # `5a` — which is exactly the edit a session obeying "the ADR wins" would
      # make if the amendment were lost — would otherwise never re-run the check
      # that watches for it. Same argument as `docs/CONVENTIONS.md` above: the
      # one file whose job is to stop a stale claim must not be the one edit CI
      # never looks at.
      - "docs/adr/ADR-035-target-architecture-postgres-react-native.md"

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: app (node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # ONE NODE VERSION, AND THE ASYMMETRY WITH money.yml IS DELIBERATE.
      # money.yml runs 22 and 24 because its subject is integer arithmetic that
      # "should not" depend on the engine — and "should not" is the class of
      # statement §1 exists to distrust, so it is measured. That measurement
      # already exists and this workflow would not add to it: the app's suite
      # calls the same functions across a workspace edge. 22 is the floor the
      # root manifest's `engines` declares.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # `npm ci` and not `npm install`: the lockfile is the pinned input, the
      # same argument that pins the Supabase CLI version in db.yml.
      - name: Install
        run: npm ci

      # ⚠️ THIS STEP IS THE ONE THAT CAN FAIL ON A MISSING WORKSPACE ENTRY.
      # `--workspace @tienda/app` exits non-zero if the root manifest does not
      # declare it, so "the fourth workspace is registered" is asserted by the
      # run rather than by reading package.json.
      - name: Typecheck
        run: npm run typecheck --workspace @tienda/app

      # ⚠️ THE COUNTER, AND WHY IT IS HERE — the same guard money.yml carries,
      # for the same reason. 3.3 found that a suite can print `not ok` and exit
      # 0, and the lesson generalised: A GREEN TICK IS ALSO WHAT A STEP THAT
      # ASSERTED NOTHING LOOKS LIKE. This repository has now hit four shapes of
      # that (3.3's disarmed pgTAP exception, 3.6a's empty Vitest workspace,
      # 4b-i's `where not passed`, and 5a-i's own falsification fixture that
      # edited nothing). "No test files found" is the one that would otherwise
      # be silent here, and Vitest exits non-zero on it.
      #
      # The count is READ FROM THE JSON REPORTER, not scraped from the terminal:
      # money.yml's first spelling grepped the summary line and failed its own
      # first CI run on a GREEN suite, because Vitest wraps that line in ANSI
      # colour codes. The reporter is a contract; the formatting is not.
      - name: Vitest — the workspace-boundary suite (plan 5a-i)
        run: |
          set -o pipefail
          npm run test --workspace @tienda/app -- \
            --reporter=default --reporter=json --outputFile="$PWD/vitest-report.json"
          node -e '
            const r = require("./vitest-report.json");
            if (!r.success) { console.error("suite reported failure"); process.exit(1); }
            if (!r.numTotalTests || r.numTotalTests < 1) {
              console.error("no tests ran — a green here would assert nothing");
              process.exit(1);
            }
            if (r.numFailedTests > 0) {
              console.error(`${r.numFailedTests} failing assertions`);
              process.exit(1);
            }
            console.log(`${r.numPassedTests} assertions ran over the app workspace boundary`);
          '

      # ⚠️ LAST, AND DELIBERATELY NOT FIRST. Plan task 5a-iv-b. The two steps
      # above assert CORRECTNESS — does it compile, does it compute the right
      # number. This one asserts FORM: is `docs/CONVENTIONS.md` still describing
      # the codebase a junior is about to add a file to. A red form check placed
      # ahead of a red correctness check hides it and costs a round trip, and
      # form is the cheaper of the two to fix.
      #
      # It needs no node and no install — it is bash over the working tree — so
      # its position here costs nothing but the ordering.
      - name: Conventions — is docs/CONVENTIONS.md still true of app/ (plan 5a-iv-b)
        run: bash docs/checks/conventions-gate.sh

      # ⚠️⚠️ AND CAN THAT GATE STILL FAIL. Added 2026-09-17 (plan task `5b.6`).
      # The step above prints "all N assertion groups passed", and that sentence
      # is ALSO what a gate which stopped reading the files prints — rule 4 of
      # this repository. This is what distinguishes the two: twenty-seven
      # fixtures, twenty-six of which must turn that gate red and one of which
      # must leave it green, each a copy of the tree with exactly one thing
      # broken. ⚠️ The count is in that harness's own anti-vacuity floor; it is
      # deliberately NOT repeated in this step's name, because `5b.5` found the
      # number stale in three places at once.
      #
      # ⚠️ IT WRITES NOTHING TO THE TREE (mktemp, trapped) and needs no node, so
      # it costs seconds. That it was not here is why two of its fixtures were
      # silently dead until a session ran it by hand.
      - name: Conventions — can that gate still fail (its own fixtures)
        run: bash docs/checks/conventions-gate-falsify.sh

  # ============================================================================
  # ⚠️⚠️ SPLIT OUT OF THE `vitest` JOB ON 2026-09-25, BECAUSE THAT JOB WAS
  # CANCELLED AT ITS OWN 10-MINUTE TIMEOUT — TWICE, ON CONSECUTIVE COMMITS.
  # ============================================================================
  # `5g-iii` took it from 9m28s to 10m15s and the cap did the rest: the run on
  # PR #208 passed at 9m28s, **47 seconds of headroom**, and the very next commit
  # crossed it. ⚠️ **Both cancellations landed on the LAST step** — the handbook
  # falsifier — **so every assertion before it had already passed and the job
  # still reported failure.** A cancelled job is not a red assertion, and telling
  # them apart takes reading `--json jobs`; the tick says neither.
  #
  # ⚠️ IT IS A SPLIT AND NOT A RAISED TIMEOUT, WHICH IS THIS REPOSITORY'S OWN
  # PRECEDENT: `db.yml`'s `5R-g` job was cancelled the same way and was SPLIT
  # rather than given more minutes. A cap that moves every time the work grows is
  # not a cap, and the thing it protects — a run somebody will actually wait for
  # — is lost either way.
  #
  # ⚠️⚠️ AND THE SEAM IS FREE HERE, WHICH IS WHY IT IS THE RIGHT ONE: **not one
  # document guard needs `node_modules`.** They are bash and python over
  # `docs/`. So this job checks out and runs — no `setup-node`, no `npm ci` —
  # and it takes the install off the critical path of the half that grew.
  # ⚠️ The two halves also fail for different reasons: the job above says *the
  # code is wrong*, and this one says *the documents disagree with each other*.
  # Reading one tick for both is how a stale plan and a broken suite looked
  # alike.
  documents:
    name: the documents still agree (plan + handbook)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4


      # ⚠️ `plan-handover.sh` asserts a clean working tree. On a checkout that
      # is free; the assertion is aimed at the owner's Mac.
      - name: Plan — can a cleared session find the next task (plan 5a-iv-c-1)
        run: bash docs/checks/plan-handover.sh

      - name: Handbook — does the file the owner reads still agree with the plan
        run: bash docs/checks/handbook-agreement.sh
      - name: Handbook — can that guard still fail (its own fixtures)
        run: bash docs/checks/handbook-agreement-falsify.sh
