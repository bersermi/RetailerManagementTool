name: cocina and itacate

# THE TWO NEW APPS, WERA COCINA (`cocina/`) AND ITACATE (`itacate/`). Plan task `10.2a`.
#
# Neither `app.yml` nor any other workflow matched these folders, so the
# repository's founding rule — a file is not evidence; a green CI run is —
# stopped at their edge. Like `app.yml` on its first commit, this ships with the
# skeletons rather than with the first interesting screen: a filter added later
# is wrong for every commit that merged before it.
#
# What it asserts, per app: it compiles to the type checker, and its suite —
# who the app is to the stores and to sign-in, what it may ask a person for,
# and that the map key and the Firebase file never enter its runtime (the
# suite computes the runtime both ways, with the command the update runbook
# uses); since `10.4b-iii-a` for Cocina and `10.5-iii-a` for Itacate, each app's
# sign-in held to Wera's files. ⚠️ No workflow compiles a native app (root
# `CLAUDE.md`): a device build is the evidence for the native half.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "cocina/**"
      - "itacate/**"
      # ⚠️ `10.4b-iii-a`: COCINA'S SUITE READS FILES OUTSIDE ITS FOLDER — Wera's
      # sign-in words and its name key (one login across the apps, so one spelling
      # of each), and the privacy page its sign-in opens; since `10.4b-iii-b` also
      # Wera's address rule (`collection.ts`'s postal code), whose boxes and words
      # Cocina's kitchen form copies; and since `10.4b-iii-c` Wera's deletion
      # (`account.ts`: the function's name and region, the read's columns — one
      # function and one deletion for both apps). A change to any of them runs the
      # suite that holds Cocina to it.
      - "app/src/strings.ts"
      - "app/src/auth/credentials.ts"
      - "app/src/api/collection.ts"
      - "app/src/api/account.ts"
      # ⚠️ `10.4b-iv-a`, PUBLISHING: Cocina reads money through `packages/money`
      # (ADR-035 §2.11 — its first dependency on a workspace package), draws it with
      # a copy of Wera's formatter that its suite runs beside Wera's file, cleans a
      # typed price as Wera's `catalogWrite.ts` does, and holds the form's limits to
      # the text of `0072` and `0076`, where the database's own are written —
      # `publish_listing`'s body is `0076`'s since `10.5-i-a`.
      - "packages/money/**"
      - "app/src/format/mxn.ts"
      - "app/src/api/catalogWrite.ts"
      - "supabase/migrations/0072_a_kitchen_publishes.sql"
      - "supabase/migrations/0076_a_kitchens_own_page.sql"
      # ⚠️ `10.4b-iv-b`, *¿OLVIDASTE TU CONTRASEÑA?*: Cocina's copy of Wera's
      # support link is run beside Wera's file, and every `EXPO_PUBLIC_` value its
      # source reads is held to the update runbook's list for `--app cocina`.
      # ⚠️ `10.5-iii-a`, ITACATE'S SIGN-IN: its suite reads the same five outside
      # files — Wera's words, name key and support link, the runbook's list for
      # `--app itacate`, and the privacy page its sign-in opens — so no line is new.
      # ⚠️ `10.5-iii-b`, ITACATE'S WAY OUT: its suite reads Wera's deletion
      # (`app/src/api/account.ts`, above) and Wera Cocina's words (`cocina/**`), so
      # again no line is new.
      - "app/src/auth/support.ts"
      - "docs/runbooks/ship-an-update.sh"
      - "site/privacidad/cocina-e-itacate/index.html"
      # ⚠️ `10.5-ii`, HER PAGE AND HER PHOTOS: a square photo's two files are Wera's
      # sizes (`app/src/api/photos.ts`), and the nine trades' drawings are held to
      # their source (`brand/giros.svg`) and to the script that draws them.
      - "app/src/api/photos.ts"
      - "brand/giros.svg"
      - "store/cocina-itacate/render.sh"
      # ⚠️ `10.5-v-b`, ITACATE'S SHELL: its titles are Wera's Nunito and its `letra.ts`, and
      # *Tú*'s foot is Wera's rust cow — each copied byte for byte and held to Wera's file.
      # ⚠️ `10.5-v-c-i`, WERA COCINA'S SHELL: the same font and `letra.ts`, so no line is new.
      - "app/src/marca/letras/**"
      - "app/src/theme/letra.ts"
      - "app/src/marca/vaca-oxido.png"
      # ⚠️ `10.5-v-c-ii`, *ASÍ LA VEN* AND *VER COMO LA VEN*: Wera Cocina draws Itacate's two
      # pages from her own rows, working out again the door's rules (`on_offer_now`) and
      # `normalize_name` — and its suite reads them out of WHICHEVER MIGRATION DEFINES EACH
      # LAST (`cocina/test/comoLaVen.test.ts`), so a new migration that redefines either must
      # run it on its pull request, not first on `main`. Every migration, then, not only the
      # two above; Itacate's pages are `itacate/**`, already here.
      - "supabase/migrations/**"
      # ⚠️ `10.5-v-d`, WERA COCINA'S FIRST RUN: its opening is Wera's (`8g`) in Cocina's green —
      # Wera's cream cow byte for byte, Wera's splash hold below its header, Wera's steps — and
      # it starts on the splash's frame, read off the mark (`brand/wera-mark.svg`) and the
      # script that draws this app's splash and icon (`store/cocina-itacate/render.sh`, above).
      - "app/src/marca/vaca-crema.png"
      - "app/src/lib/splash.ts"
      - "app/src/theme/apertura.ts"
      - "brand/wera-mark.svg"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cocina-itacate.yml"

concurrency:
  group: cocina-itacate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: ${{ matrix.app }} (node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        app: [cocina, itacate]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # Exits non-zero if the root manifest does not declare the workspace.
      - name: Typecheck
        run: npm run typecheck --workspace @tienda/${{ matrix.app }}

      # The counter is read from the JSON reporter, as in `app.yml`: a green
      # tick is also what a suite that ran nothing looks like.
      - name: Vitest — identity, permissions, a runtime the secrets never touch (plan 10.2a), and each app's own rules
        run: |
          set -o pipefail
          npm run test --workspace @tienda/${{ matrix.app }} -- \
            --reporter=default --reporter=json --outputFile="$PWD/vitest-report.json"
          node -e '
            const r = require("./vitest-report.json");
            if (!r.success) { console.error("suite reported failure"); process.exit(1); }
            if (!r.numTotalTests || r.numTotalTests < 1) {
              console.error("no tests ran — a green here would assert nothing");
              process.exit(1);
            }
            if (r.numFailedTests > 0) {
              console.error(`${r.numFailedTests} failing assertions`);
              process.exit(1);
            }
            console.log(`${r.numPassedTests} assertions ran over ${process.env.APP}`);
          '
        env:
          APP: ${{ matrix.app }}
